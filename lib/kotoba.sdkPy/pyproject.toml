[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etzhayyim-sdk"
version = "0.1.0"
description = "Python compatibility and CLJC SDK for Etzhayyim services"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=5.6",
    "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etzhayyim_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
