name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - run: npm install -g nbb
      - run: npm ci || npm install

      - name: JVM suite
        run: clojure -M:test

      # Not redundant. `kotobase.engine` has a .clj and a .cljs
      # implementation; the JVM suite covers only the first, and the second
      # is what every Worker deployment runs. This file had been dead since
      # a rename -- it required a namespace that no longer exists, so it
      # could not even load -- and with no CI nothing said so.
      - name: cljs facade smoke
        run: nbb --classpath "$(clojure -Spath -M:cljs-test)" test/run.cljs

  # kbb runs the .cljk sources on the Promise facade (the one Worker
  # deployments run); `clojure -M:test` above finds no .cljk test and reports
  # "Ran 0 tests". Gated to the namespaces that pass today: the older
  # engine/datomic-client suites are written against the synchronous JVM
  # facade and fail under kbb independently of this job.
  kbb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kotoba-lang/setup-kbb@19f38b03b81ad038ff3c0393a2c55ebef8889901
      - name: multi-parent merge (kbb -M:test -n merge namespaces)
        run: |
          set -o pipefail
          kbb -M:test -n kotobase.engine.merge-test \
            -n kotobase.engine.merge-r2-test -n kotobase.engine.merge-perf-test \
            -n kotobase.engine.merge-adversarial-test -n kotobase.engine.merge-r3-test -n kotobase.engine.merge-r4-test 2>&1 | tee kbb-test.log
          grep -E '^kbb test: [1-9][0-9]* test\(s\), [0-9]+ pass, 0 fail, 0 error' kbb-test.log
      - name: cljs facade smoke
        run: kbb test/run.cljk
