[package]
name = "cc-phase3"
version = "0.2.0"
edition = "2021"
description = "Common Crawl WAT → Parquet / SQL (Shannon-optimal direct pipeline)"

[[bin]]
name = "cc-phase3"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
ahash = "0.8"
libc = "0.2"
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["zstd"] }

[profile.release]
opt-level = 3
lto = "thin"
