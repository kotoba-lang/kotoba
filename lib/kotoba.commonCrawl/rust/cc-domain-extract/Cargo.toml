[package]
name = "cc-domain-extract"
version = "0.1.0"
edition = "2021"
description = "Extract all unique domains from CC SQL batch files (parallel)"

[[bin]]
name = "cc-domain-extract"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
memchr = "2"

[profile.release]
opt-level = 3
lto = "thin"
