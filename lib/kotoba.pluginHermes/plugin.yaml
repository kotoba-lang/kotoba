name: kotoba
version: 0.1.0
description: >-
  Native Hermes tools for the kotoba-lang authorities — the three questions an
  agent gets wrong from memory: is this refusal permanent or a backend gap
  (`kotoba_surface_status`), which backends have qualified a capability
  (`kotoba_capability_kits`), and does this guest actually run (`kotoba_check`).
  The plugin implements none of those answers: it shells out to a reader in the
  same language as the data, so there is exactly one reader (ADR-2608197300 §3).
  Read-only. Registers nothing unless a workspace is configured.
author: kotoba-lang
kind: backend
provides_tools:
  - kotoba_surface_status
  - kotoba_capability_kits
  - kotoba_check
requires_env:
  - KOTOBA_WORKSPACE
