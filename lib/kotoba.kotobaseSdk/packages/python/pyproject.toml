[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-kotobase"
version = "0.2.0"
description = "Portable Kotobase query client"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "net-kotobase contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
