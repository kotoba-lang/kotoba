<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="/composite-proof-bundle.js"></script>
<script>
window.runCompositeProof = async function () {
  const wc = w3.webcodecs;
  const ce = kami.eizo.compositor.e2e.entry;
  const W = 64, H = 64;

  // Foreground test plate: left half painted the pure, saturated key color;
  // right half painted a distinct, non-key subject color. Background test
  // plate: a third distinct color the keyed subject is composited over.
  const fgColors = {
    key: [20, 220, 20],     // pure saturated green -- the chroma-key color
    subject: [220, 20, 20]  // distinct non-key subject color (red)
  };
  const bgColor = [20, 20, 220]; // distinct background plate (blue)

  function paintForeground(ctx) {
    ctx.fillStyle = 'rgb(' + fgColors.key.join(',') + ')';
    ctx.fillRect(0, 0, W / 2, H);
    ctx.fillStyle = 'rgb(' + fgColors.subject.join(',') + ')';
    ctx.fillRect(W / 2, 0, W / 2, H);
  }

  function paintBackground(ctx) {
    ctx.fillStyle = 'rgb(' + bgColor.join(',') + ')';
    ctx.fillRect(0, 0, W, H);
  }

  function avgRegion(ctx, x0, y0, w, h) {
    const d = ctx.getImageData(x0, y0, w, h).data;
    let r = 0, g = 0, b = 0, n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  }

  function close(a, b, tol) {
    return Math.abs(a[0] - b[0]) <= tol && Math.abs(a[1] - b[1]) <= tol && Math.abs(a[2] - b[2]) <= tol;
  }

  async function encodeDecodePlate(paintFn) {
    const src = document.createElement('canvas');
    src.width = W; src.height = H;
    const sctx = src.getContext('2d');
    paintFn(sctx);

    const frame = wc.make_video_frame(src, { timestamp: 0 });
    const encodedChunks = [];
    let decoderConfigFromEncoder = null;
    const encoder = wc.make_video_encoder({
      output: (chunk, metadata) => {
        encodedChunks.push(chunk);
        if (metadata && metadata.decoderConfig) decoderConfigFromEncoder = metadata.decoderConfig;
      },
      error: (e) => { throw e; }
    });
    wc.configure_video_encoder_BANG_(encoder, {
      codec: 'avc1.42001f',
      width: W, height: H,
      bitrate: 2_000_000,
      framerate: 30,
      avc: { format: 'avc' }
    });
    wc.encode_video_frame_BANG_(encoder, frame, { keyFrame: true });
    await wc.video_encoder_flush_BANG_(encoder);
    wc.close_video_encoder_BANG_(encoder);
    wc.close_video_frame_BANG_(frame);

    if (encodedChunks.length === 0) throw new Error('no encoded chunks produced');
    if (!decoderConfigFromEncoder) throw new Error('no decoder config emitted by encoder');

    const decodedFrames = [];
    const decoder = wc.make_video_decoder({
      output: (f) => decodedFrames.push(f),
      error: (e) => { throw e; }
    });
    wc.configure_video_decoder_BANG_(decoder, {
      codec: decoderConfigFromEncoder.codec,
      codedWidth: decoderConfigFromEncoder.codedWidth,
      codedHeight: decoderConfigFromEncoder.codedHeight,
      description: decoderConfigFromEncoder.description
    });
    for (const chunk of encodedChunks) wc.decode_video_chunk_BANG_(decoder, chunk);
    await wc.video_decoder_flush_BANG_(decoder);
    wc.close_video_decoder_BANG_(decoder);

    if (decodedFrames.length === 0) throw new Error('no decoded frames produced');
    const decoded = decodedFrames[0];

    const dst = document.createElement('canvas');
    dst.width = W; dst.height = H;
    const dctx = dst.getContext('2d');
    dctx.drawImage(decoded, 0, 0);
    decoded.close();
    return dctx;
  }

  // --- Stage 1: real encode -> decode of the foreground (key/subject
  // halves) and background plates. These are REAL decoded H.264 pixel
  // values (slightly lossy vs. the painted input), not synthetic numbers --
  // this is the input the chroma-key + composite math below runs on.
  const fgCtx = await encodeDecodePlate(paintForeground);
  const bgCtx = await encodeDecodePlate(paintBackground);

  const decodedFg = {
    key: avgRegion(fgCtx, 0, 0, W / 2, H),
    subject: avgRegion(fgCtx, W / 2, 0, W / 2, H)
  };
  const decodedBg = avgRegion(bgCtx, 0, 0, W, H);

  // --- Stage 2: apply kami-eizo-compositor's real (compiled-into-this-
  // bundle) chroma-key alpha computation to those real decoded foreground
  // pixels, in-browser -- configured against the ideal painted key color
  // but evaluated on the real (lossy) decoded one.
  const alphaByBrowser = {
    key: ce.key_alpha_rgb255_js(decodedFg.key[0], decodedFg.key[1], decodedFg.key[2]),
    subject: ce.key_alpha_rgb255_js(decodedFg.subject[0], decodedFg.subject[1], decodedFg.subject[2])
  };

  // --- Stage 3: composite each foreground region over the real decoded
  // background plate using :normal blend mode with the just-computed
  // chroma-key alpha as opacity -- the same EizoChromaKey-alpha-feeds-
  // EizoComposite-opacity wiring kami.eizo.compositor.nodes/example-workflow
  // documents.
  const compositedByBrowser = {
    key: Array.from(ce.composite_rgb255_js(
      decodedFg.key[0], decodedFg.key[1], decodedFg.key[2],
      decodedBg[0], decodedBg[1], decodedBg[2],
      alphaByBrowser.key)),
    subject: Array.from(ce.composite_rgb255_js(
      decodedFg.subject[0], decodedFg.subject[1], decodedFg.subject[2],
      decodedBg[0], decodedBg[1], decodedBg[2],
      alphaByBrowser.subject))
  };

  // --- Stage 4 (bonus): full real round-trip -- re-encode the composited
  // colors as a two-half plate and decode them back again, proving the
  // composited pixels themselves survive a second real H.264 encode/decode
  // pass, not just the arithmetic.
  function paintComposited(ctx) {
    ctx.fillStyle = 'rgb(' + compositedByBrowser.key.join(',') + ')';
    ctx.fillRect(0, 0, W / 2, H);
    ctx.fillStyle = 'rgb(' + compositedByBrowser.subject.join(',') + ')';
    ctx.fillRect(W / 2, 0, W / 2, H);
  }
  const recompositedCtx = await encodeDecodePlate(paintComposited);
  const decodedAfterRecomposite = {
    key: avgRegion(recompositedCtx, 0, 0, W / 2, H),
    subject: avgRegion(recompositedCtx, W / 2, 0, W / 2, H)
  };

  const tolCodec = 40; // H.264 lossy compression tolerance (matches org-w3-webcodecs's/kami-eizo-grade's own E2E)
  const recompositeOk = {
    key: close(decodedAfterRecomposite.key, compositedByBrowser.key, tolCodec),
    subject: close(decodedAfterRecomposite.subject, compositedByBrowser.subject, tolCodec)
  };
  const recompositePass = recompositeOk.key && recompositeOk.subject;

  return {
    fgPainted: fgColors,
    bgPainted: bgColor,
    decodedFg: decodedFg,
    decodedBg: decodedBg,
    alphaByBrowser: alphaByBrowser,
    compositedByBrowser: compositedByBrowser,
    decodedAfterRecomposite: decodedAfterRecomposite,
    recompositeOk: recompositeOk,
    recompositePass: recompositePass,
    tolCodec: tolCodec
  };
};
</script>
</body></html>
