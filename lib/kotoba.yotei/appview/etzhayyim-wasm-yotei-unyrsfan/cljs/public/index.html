<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yotei (予定)</title>
    <link rel="stylesheet" href="vendor/kotoba-ui.css">
    <style>
      body { margin: 0; background: #0a0a0a; color: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .yt-root { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      .yt-header { display: flex; align-items: center; justify-content: center; height: 48px; border-bottom: 1px solid rgba(255,255,255,0.10); flex-shrink: 0; font-weight: 700; letter-spacing: 0.02em; }
      .yt-main { flex: 1; overflow-y: auto; }
      .yt-content { max-width: 600px; margin: 0 auto; padding: 16px 16px 80px; box-sizing: border-box; }
      .yt-nav { display: flex; align-items: center; justify-content: space-around; height: 56px; border-top: 1px solid rgba(255,255,255,0.10); background: #0a0a0a; flex-shrink: 0; }
      .yt-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; min-width: 44px; justify-content: center; background: none; border: none; cursor: pointer; font: inherit; }
      .yt-tab-active { color: #6366f1; } .yt-tab-idle { color: rgba(255,255,255,0.5); }
      .yt-tab .icon { font-size: 18px; } .yt-tab .label { font-size: 11px; }
      .yt-input, .yt-select, .yt-textarea { padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); color: #fff; font-size: 15px; box-sizing: border-box; }
      .yt-input { flex: 1; min-width: 0; } .yt-textarea { width: 100%; resize: none; font-family: inherit; }
      .yt-btn { padding: 8px 16px; border-radius: 8px; background: #6366f1; color: #fff; font-size: 15px; min-height: 44px; border: none; cursor: pointer; }
      .yt-btn:disabled { opacity: 0.4; }
      .yt-btn-ghost { padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); color: #fff; min-height: 44px; cursor: pointer; }
      .yt-link { background: none; border: none; color: #818cf8; font-size: 13px; cursor: pointer; padding: 0; font: inherit; color: #818cf8; }
      .yt-muted { color: rgba(255,255,255,0.5); } .yt-dim { color: rgba(255,255,255,0.4); }
      .yt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .yt-spread { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .yt-card { padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); }
      .yt-calendar-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
      .yt-cal { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 13px; }
      .yt-cal th { text-align: center; font-weight: 500; padding: 8px 0; }
      .yt-cal th .dow { color: #fff; } .yt-cal th .dom { color: rgba(255,255,255,0.5); font-weight: 400; }
      .yt-cal td.hour-label { color: rgba(255,255,255,0.5); text-align: right; padding-right: 8px; vertical-align: top; padding-top: 4px; }
      .yt-cell { border: 1px solid rgba(255,255,255,0.10); height: 40px; vertical-align: top; padding: 2px; }
      .yt-cell-avail { background: rgba(99,102,241,0.10); }
      .yt-evt { font-size: 11px; background: #6366f1; color: #fff; border-radius: 4px; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .yt-center { text-align: center; color: rgba(255,255,255,0.5); padding: 32px 0; font-size: 13px; }
      .yt-result { font-size: 13px; color: #4ade80; text-align: center; }
      .yt-badge { font-size: 11px; padding: 2px 8px; border-radius: 9999px; }
      .yt-badge-proposed { background: rgba(234,179,8,0.2); color: #fde047; }
      .yt-badge-confirmed { background: rgba(34,197,94,0.2); color: #86efac; }
      .yt-badge-declined { background: rgba(239,68,68,0.2); color: #fca5a5; }
      .yt-badge-cancelled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); }
      .yt-cancel { background: none; border: 1px solid transparent; color: #f87171; font-size: 11px; padding: 4px 8px; border-radius: 4px; min-height: 44px; cursor: pointer; font: inherit; }
      .yt-stack { display: flex; flex-direction: column; gap: 8px; }
      .yt-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
      .yt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: rgba(255,255,255,0.5); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="js/app.js"></script>
  </body>
</html>
