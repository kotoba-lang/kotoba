<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="/webcodecs-bundle.js"></script>
<script>
window.runE2E = async function () {
  const W = 64, H = 64;
  const src = document.createElement('canvas');
  src.width = W; src.height = H;
  const sctx = src.getContext('2d');
  // 4 quadrants, distinct solid colors, large uniform regions to survive lossy compression
  sctx.fillStyle = 'rgb(230,20,20)';   sctx.fillRect(0,0,W/2,H/2);       // TL red
  sctx.fillStyle = 'rgb(20,200,20)';   sctx.fillRect(W/2,0,W/2,H/2);     // TR green
  sctx.fillStyle = 'rgb(20,20,230)';   sctx.fillRect(0,H/2,W/2,H/2);     // BL blue
  sctx.fillStyle = 'rgb(230,220,20)';  sctx.fillRect(W/2,H/2,W/2,H/2);   // BR yellow

  const originalFrame = w3.webcodecs.make_video_frame(src, {timestamp: 0});

  const encodedChunks = [];
  let decoderConfigFromEncoder = null;
  const encoder = w3.webcodecs.make_video_encoder({
    output: (chunk, metadata) => {
      encodedChunks.push(chunk);
      if (metadata && metadata.decoderConfig) decoderConfigFromEncoder = metadata.decoderConfig;
    },
    error: (e) => { throw e; }
  });
  w3.webcodecs.configure_video_encoder_BANG_(encoder, {
    codec: 'avc1.42001f',
    width: W, height: H,
    bitrate: 2_000_000,
    framerate: 30,
    avc: { format: 'avc' }
  });
  w3.webcodecs.encode_video_frame_BANG_(encoder, originalFrame, {keyFrame: true});
  await w3.webcodecs.video_encoder_flush_BANG_(encoder);
  w3.webcodecs.close_video_encoder_BANG_(encoder);
  w3.webcodecs.close_video_frame_BANG_(originalFrame);

  if (encodedChunks.length === 0) throw new Error('no encoded chunks produced');
  if (!decoderConfigFromEncoder) throw new Error('no decoder config emitted by encoder');

  const decodedFrames = [];
  const decoder = w3.webcodecs.make_video_decoder({
    output: (frame) => decodedFrames.push(frame),
    error: (e) => { throw e; }
  });
  w3.webcodecs.configure_video_decoder_BANG_(decoder, {
    codec: decoderConfigFromEncoder.codec,
    codedWidth: decoderConfigFromEncoder.codedWidth,
    codedHeight: decoderConfigFromEncoder.codedHeight,
    description: decoderConfigFromEncoder.description
  });
  for (const chunk of encodedChunks) {
    w3.webcodecs.decode_video_chunk_BANG_(decoder, chunk);
  }
  await w3.webcodecs.video_decoder_flush_BANG_(decoder);
  w3.webcodecs.close_video_decoder_BANG_(decoder);

  if (decodedFrames.length === 0) throw new Error('no decoded frames produced');
  const decoded = decodedFrames[0];

  const dst = document.createElement('canvas');
  dst.width = W; dst.height = H;
  const dctx = dst.getContext('2d');
  dctx.drawImage(decoded, 0, 0);
  decoded.close();

  function avg(ctx, x0,y0,w,h) {
    const d = ctx.getImageData(x0,y0,w,h).data;
    let r=0,g=0,b=0, n = d.length/4;
    for (let i=0;i<d.length;i+=4) { r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
    return [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
  }

  const quads = {
    TL: avg(dctx, 0,0,W/2,H/2),
    TR: avg(dctx, W/2,0,W/2,H/2),
    BL: avg(dctx, 0,H/2,W/2,H/2),
    BR: avg(dctx, W/2,H/2,W/2,H/2)
  };
  const expected = {
    TL: [230,20,20], TR: [20,200,20], BL: [20,20,230], BR: [230,220,20]
  };
  function close(a,b,tol) { return Math.abs(a[0]-b[0])<=tol && Math.abs(a[1]-b[1])<=tol && Math.abs(a[2]-b[2])<=tol; }
  const tol = 40; // H.264 lossy compression tolerance
  const pass = Object.keys(expected).every(k => close(quads[k], expected[k], tol));

  return {
    pass,
    tol,
    expected,
    decoded: quads,
    numEncodedChunks: encodedChunks.length,
    numDecodedFrames: decodedFrames.length,
    decoderConfigUsed: {
      codec: decoderConfigFromEncoder.codec,
      codedWidth: decoderConfigFromEncoder.codedWidth,
      codedHeight: decoderConfigFromEncoder.codedHeight,
      descriptionByteLength: decoderConfigFromEncoder.description ? decoderConfigFromEncoder.description.byteLength : null
    }
  };
};
</script>
</body></html>
