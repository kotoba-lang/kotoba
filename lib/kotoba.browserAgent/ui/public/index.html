<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browser-agent-clj</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #0e1116; color: #e6edf3; }
      .app { padding: 16px 24px; }
      h1 { font-size: 18px; }
      .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
      .pane { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
      .pane h3 { margin: 0 0 8px; font-size: 13px; color: #7d8590; text-transform: uppercase; letter-spacing: .04em; }
      .badge { background: #1f6feb; color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 11px; }
      .step, .row { padding: 4px 0; border-bottom: 1px solid #21262d; }
      .answer pre { white-space: pre-wrap; background: #0d1117; padding: 8px; border-radius: 6px; }
      .url { color: #58a6ff; font-size: 12px; word-break: break-all; }
      .frame { height: 180px; display: grid; place-items: center; color: #7d8590; border: 1px dashed #30363d; border-radius: 6px; }
      img { max-width: 100%; border-radius: 6px; }
      button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app" class="app">
      <h1>browser-agent-clj</h1>
      <div class="cols">
        <section class="pane">
          <h3>Plan</h3>
          <div class="frame">Host UI adapter renders browseragent.events here.</div>
        </section>
        <section class="pane">
          <h3>Mixture-of-Agents</h3>
          <div class="frame">Delegation events are CLJC data, not a bundled app.</div>
        </section>
        <section class="pane">
          <h3>Agent browser</h3>
          <div class="frame">Frames and take-over controls are host-owned.</div>
        </section>
      </div>
    </div>
  </body>
</html>
