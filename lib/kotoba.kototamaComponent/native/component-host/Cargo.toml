[package]
name = "tender-component-host"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
# Keep the native TCB small: no WASI, GC, cache, profiling, debugger,
# component-async, or automatic parallel compilation surfaces.
wasmtime = { version = "=42.0.1", default-features = false, features = ["component-model", "cranelift", "runtime"] }
kotoba-abi-wit = { git = "https://github.com/kotoba-lang/abi.git", rev = "6b2e5185ff98aa9cfec3f371a019e75b4c089aae" }
