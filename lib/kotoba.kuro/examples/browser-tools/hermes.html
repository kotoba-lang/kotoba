<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hermes browser</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;background:#fafaf8;color:#222}label{display:block;margin:16px 0}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{width:100%;border:1px solid #bbb;border-radius:6px}textarea{min-height:100px}button{cursor:pointer}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px;min-height:120px}small{color:#555}</style>
<h1>Hermes browser</h1><p>ブラウザで応答を受け取り、JS・Python を実行します。会話はこのブラウザに保存されます。</p>
<label>モデル接続先<input id="endpoint" value="/live-model"></label><label>モデル<input id="model" value="your-endpoint-model"></label>
<label>会話の名前<input id="session" value="my-conversation" pattern="[a-zA-Z0-9_-]+"></label>
<label>メッセージ<textarea id="prompt" placeholder="JS と Python で 21 × 2 を計算して"></textarea></label>
<button id="run">送信</button> <button id="stop" disabled>停止</button> <button id="restore">保存した会話を見る</button>
<p id="status" role="status">接続先を設定してください。</p><pre id="output" aria-live="polite"></pre>
<small>試験版です。接続先はストリーミングとツール呼び出しに対応した Chat Completions API が必要です。保存は完了した応答に限り、ブラウザのデータ削除で失われます。</small>
<script type="module">
import {createHermesBrowser} from './hermes.js';
const el=id=>document.getElementById(id);let controller;
try{const response=await fetch('./live-model-config');if(response.ok){const config=await response.json();el('model').value=config.model;el('endpoint').value=config.modelEndpoint;el('status').textContent='Hugging Face に接続します。';}}catch{}
const host=()=>createHermesBrowser({modelEndpoint:el('endpoint').value,model:el('model').value,capabilities:['tool/js','tool/python','tool/python-js-bridge','network/model','session/persist']});
el('run').onclick=async()=>{
 el('run').disabled=true;el('restore').disabled=true;el('stop').disabled=false;el('output').textContent='';el('status').textContent='応答を待っています…';controller=new AbortController();
 try{const result=await host().run({sessionId:el('session').value,prompt:el('prompt').value},{signal:controller.signal,onDelta:text=>{el('output').textContent+=text;el('status').textContent='受信中…';}});el('output').textContent=result.final_response;el('status').textContent=result.saved?'会話を保存しました。':'応答は完了していないため、保存しませんでした。';}
 catch(error){el('status').textContent=error.message==='cancelled'?'停止しました。最後に保存した会話から再開できます。':error.message;}
 finally{el('run').disabled=false;el('restore').disabled=false;el('stop').disabled=true;}
};
el('stop').onclick=()=>controller?.abort();
el('restore').onclick=async()=>{try{const saved=await host().load(el('session').value);el('output').textContent=saved?saved.messages.filter(m=>m.role!=='tool').map(m=>`${m.role==='user'?'あなた':'Hermes'}: ${m.content||''}`).join('\n\n'):'保存した会話はありません。';}catch(e){el('status').textContent=e.message;}};
</script></html>
