<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Kuro browser tools</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto}textarea,pre{width:100%;box-sizing:border-box;padding:16px}textarea{height:220px}button,select{padding:10px;margin:10px 5px 10px 0}pre{background:#eee;white-space:pre-wrap}</style>
<h1>ブラウザで JS / Python を実行</h1>
<p>各実行は独立した Worker を使います。Python の JS 連携にはブラウザ権限があるため、信頼できるコードを実行してください。</p>
<select id="language"><option value="js">JavaScript</option><option value="python">Python</option></select>
<textarea id="code">console.log('こんにちは');
inputs.a + inputs.b</textarea>
<button id="run">実行</button><button id="cancel" disabled>停止</button>
<pre id="output">入力: {"a": 20, "b": 22}</pre>
<script type="module">
import {createToolHost, toolDefinitions} from './client.js';
const host = createToolHost({capabilities: ['tool/js', 'tool/python', 'tool/python-js-bridge', 'fs/read', 'fs/write']});
let controller;
language.onchange = () => {code.value = language.value === 'js' ? "console.log('こんにちは');\ninputs.a + inputs.b" : "print('こんにちは')\ninputs['a'] + inputs['b']";};
run.onclick = async () => {
  controller = new AbortController(); run.disabled = true; cancel.disabled = false; output.textContent = '実行中…';
  try {output.textContent = JSON.stringify(await host.call({id: crypto.randomUUID(), type: 'function', function: {
    name: language.value, arguments: JSON.stringify({code: code.value, inputs: {a: 20, b: 22}})
  }}, {signal: controller.signal}), null, 2);} finally {run.disabled = false; cancel.disabled = true;}
};
cancel.onclick = () => controller?.abort();
window.browserTools = {host, toolDefinitions};
</script></html>
