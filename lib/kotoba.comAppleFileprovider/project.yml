name: KotobaFileProvider
options:
  bundleIdPrefix: org.kotoba
  deploymentTarget:
    macOS: "13.0"
packages:
  KotobaFileProvider:
    path: .
targets:
  KotobaDrive:
    type: application
    platform: macOS
    sources: [Host]
    dependencies:
      - target: KotobaDriveFileProvider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kotoba.drive
        INFOPLIST_FILE: Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Host/KotobaDrive.entitlements
        CODE_SIGN_STYLE: Automatic
  KotobaDriveFileProvider:
    type: app-extension
    platform: macOS
    sources: [Extension]
    dependencies:
      - package: KotobaFileProvider
        product: KotobaFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kotoba.drive.fileprovider
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/KotobaDriveFileProvider.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  KotobaDrive:
    build:
      targets:
        KotobaDrive: all
        KotobaDriveFileProvider: all
