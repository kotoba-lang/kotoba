name: FloorplanLab
options:
  bundleIdPrefix: dev.kotoba-lang
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 3A5CBTEBFP
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  FloorplanLabApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FloorplanLabApp
        excludes:
          - Info.plist
      # web/'s built static bundle (index.html + js/app.js -- the cljs
      # 3D viewer, see ../web/README-equivalent doc comments in
      # ../web/src/floorplan_lab/viewer.cljk / .../viewer/build.clj).
      # `type: folder` makes this a folder REFERENCE (blue folder), which
      # preserves the "public/js/app.js" nesting inside the app bundle --
      # a plain group would flatten it and break index.html's relative
      # "./js/app.js" script src plus FloorplanMapView's
      # `Bundle.main.url(forResource:withExtension:subdirectory:)` lookup.
      - path: ../web/public
        name: public
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kotoba-lang.FloorplanLab
        PRODUCT_NAME: FloorplanLabApp
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 3A5CBTEBFP
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: FloorplanLabApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
