[package]
name = "com-kotobalabs-x402"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "x402 client: read the 402, pay, retry. Holds no key — the signer is injected."
repository = "https://github.com/kotoba-lang/x402-sdk"
keywords = ["x402", "micropayments", "usdc", "http-402"]
categories = ["web-programming::http-client", "api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
