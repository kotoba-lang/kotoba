[project]
name = "com-kotobalabs-x402"
version = "0.1.0"
description = "x402 client: read the 402, pay, retry. Holds no key — the signer is injected."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["x402", "micropayments", "usdc", "base", "ai-agents", "http-402"]
dependencies = []

[project.urls]
Homepage = "https://github.com/kotoba-lang/x402-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_sdk"]
