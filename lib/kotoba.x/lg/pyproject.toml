[project]
name = "lg-x"
version = "0.1.0"
description = "x.etzhayyim.com OSS LangGraph FastAPI server (P5 — social platform ops)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "langgraph>=0.2.50",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "httpx>=0.27.0",
    "kotodama",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.300",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "lg_x",
]
