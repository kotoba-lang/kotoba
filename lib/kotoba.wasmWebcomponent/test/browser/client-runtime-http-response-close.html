<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="frame-src 'none'; connect-src https://httpbin.org"><title>Synthetic HTTPS cancellation probe</title><h1>Synthetic HTTPS cancellation probe</h1><p>This test contacts httpbin.org anonymously after consent; it uses no account or financial data. Add ?normal=1 for the non-cancelling control.</p><p id="state">preparing</p><p id="phase">waiting</p><main></main>
<script type="module">
import {createClientConsentHost,createClientOperationBroker,verifyClientArtifact,mountRestrictedClientApp} from '../../src/kotoba-client-runtime.js';
const url='https://httpbin.org/drip?duration=5&numbytes=10&delay=0&code=200'; const op={capability:'test/delayed-response',service:'httpbin-synthetic',operation:'read',consent:'each-operation','data-categories':['synthetic-response'],endpoint:{origin:'https://httpbin.org',routes:[{method:'GET',path:'/drip','query-params':['duration','numbytes','delay','code'],'query-values':{duration:'5',numbytes:'10',delay:'0',code:'200'}}]}};
const runtime={schema:'kotoba.app.client-runtime.v1',target:'browser',profile:'restricted-wasm-v1',entry:'app.html','local-state':{adapter:'localstorage',schema:'test.state.v1',version:1},workers:[],operations:[op]};
const state=document.querySelector('#state'); const count=()=>performance.getEntriesByType('resource').filter(e=>e.name===url).length; new PerformanceObserver(()=>{const entries=performance.getEntriesByType('resource').filter(e=>e.name===url);state.textContent='HTTP resource entries '+entries.length+(entries.length?' duration-ms '+Math.round(entries[entries.length-1].duration):'');}).observe({type:'resource',buffered:true});
try {
const consentHost=createClientConsentHost();
const broker=createClientOperationBroker({runtime,requestedCapabilities:[op.capability],approvedOperations:[op],hostSupportedOperations:[[op.capability,op.service,op.operation]],consentHost});
const guest=`<button id="go">Request synthetic HTTPS response</button><p id="result">waiting</p><script>let port, n=0;addEventListener('message', e=>{if(e.data.protocol!=='kotoba.client.host.v1'||e.ports.length!==1)return;port=e.ports[0];port.onmessage=e=>document.getElementById('result').textContent=e.data.ok?'approved HTTP status '+e.data.status:'denied '+e.data.error;});document.getElementById('go').onclick=()=>{port.postMessage({protocol:'kotoba.client.operation.v1',id:'request-'+(++n),selector:{capability:'test/delayed-response',service:'httpbin-synthetic',operation:'read'},payload:{input:'https://httpbin.org/drip?duration=5&numbytes=10&delay=0&code=200'}})};<\/script>`;
const bytes=new TextEncoder().encode(guest), digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
const artifact=await verifyClientArtifact(bytes,{revision:'1111111111111111111111111111111111111111',sha256:digest,'max-bytes':1048576});
let mount;const wrapped={async invoke(...args){const result=await broker.invoke(...args);document.querySelector('#phase').textContent='headers received';if(!new URLSearchParams(location.search).has('normal')) setTimeout(()=>{mount.close();document.querySelector('#phase').textContent='closed after headers';},800);return result;}};mount=await mountRestrictedClientApp({artifact,container:document.querySelector('main'),broker:wrapped});state.textContent='HTTP resource entries '+count();
}catch(e){state.textContent='SETUP FAILED '+e.message}
</script>
