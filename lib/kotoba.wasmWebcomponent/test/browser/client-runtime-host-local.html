<!doctype html>
<meta charset="utf-8">
<title>KOTOBA-968 host-local probe (synthetic)</title>
<link rel="stylesheet" href="../../src/kotoba-client-consent.css">
<div id="app"></div>
<script type="module">
// Synthetic probe: a sandboxed srcdoc guest uses host-local storage and device.save through the real channel,
// with the real IndexedDB backend of this host origin. No provider, no real data, no network operation.
import * as rt from '../../src/kotoba-client-runtime.js';
const hex = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('');
const APP = 'org.example.browser-probe';
const MARKER = 'MARKER-browser-plaintext-5e2c';
const descriptor = {
  schema: 'kotoba.app.client-runtime.v1', target: 'browser', profile: 'restricted-wasm-v1', entry: 'index.html',
  'local-state': { adapter: 'memory', schema: 's', version: 1 }, operations: [],
  'host-local': {
    schema: 'kotoba.host-local.v1', 'app-id': APP,
    storage: { class: 'device-only', backup: 'excluded', 'at-rest': 'encrypted', erasable: true, 'quota-bytes': 1048576, 'max-entries': 100, 'max-value-bytes': 65536 },
    stores: ['files'], calls: ['storage.put', 'storage.get', 'storage.list', 'device.save'],
    save: { 'max-bytes': 4096, 'mime-types': ['application/json'] },
  },
};
// The guest reports to this page with parent.postMessage (allowed from a sandboxed frame); the test reads window.log.
const guest = `<script>
  const log = (step, value) => parent.postMessage({ probe: true, step, value }, '*');
  try { indexedDB.open('x'); log('guest-indexeddb', 'available'); } catch (e) { log('guest-indexeddb', e.name); }
  try { localStorage.length; log('guest-localstorage', 'available'); } catch (e) { log('guest-localstorage', e.name); }
  onmessage = (event) => {
    if (event.data?.protocol !== 'kotoba.client.host.v1') return;
    const port = event.ports[0]; let n = 0; const waiting = new Map();
    port.onmessage = ({ data }) => { if (waiting.has(data.id)) { waiting.get(data.id)(data); waiting.delete(data.id); } };
    const call = (call, args) => new Promise((resolve) => { const id = 'g' + (n++); waiting.set(id, resolve); port.postMessage({ protocol: 'kotoba.client.local.v1', id, call, args }); });
    (async () => {
      const before = await call('storage.get', { store: 'files', key: 'note' });
      log('before', before.ok && before.result ? new TextDecoder().decode(before.result.value) : null);
      const put = await call('storage.put', { store: 'files', key: 'note', value: new TextEncoder().encode('${MARKER} ' + location.hash) });
      log('put', put.ok);
      const got = await call('storage.get', { store: 'files', key: 'note' });
      log('get', got.ok ? new TextDecoder().decode(got.result.value) : got.error);
      const bad = await call('storage.get', { store: 'files', key: '../x' });
      log('bad-key', bad.error);
      log('save-asked', true);
      const saved = await call('device.save', { name: '../../probe.json', type: 'application/json', value: new TextEncoder().encode('{"probe":1}') });
      log('save', saved.ok ? saved.result : saved.error);
    })();
  };
<\/script>`;
window.log = [];
addEventListener('message', (event) => { if (event.data?.probe) window.log.push([event.data.step, event.data.value]); });
window.run = async (round) => {
  const bytes = new TextEncoder().encode(JSON.stringify(descriptor));
  const keys = await crypto.subtle.generateKey('Ed25519', true, ['sign', 'verify']);
  const publicKey = hex(await crypto.subtle.exportKey('raw', keys.publicKey));
  const signature = hex(await crypto.subtle.sign('Ed25519', keys.privateKey, bytes));
  const admitted = await rt.verifySignedClientDescriptor({ bytes, signature, publicKey, pinnedPublicKey: publicKey, revision: '1'.repeat(40), digest: hex(await crypto.subtle.digest('SHA-256', bytes)) });
  const consentHost = rt.createClientConsentHost();
  const broker = rt.createClientOperationBroker({ runtime: admitted.runtime, consentHost });
  const storage = rt.createIndexedDbClientStorageBackend();
  window.conformance = await rt.verifyHostStorageConformance(storage);
  const hostLocal = rt.createClientHostLocal({ admitted, appId: APP, storage, consentHost });
  const html = guest.replace('location.hash', JSON.stringify(round));
  const artifactBytes = new TextEncoder().encode(html);
  const artifact = await rt.verifyClientArtifact(artifactBytes, { revision: '2'.repeat(40), sha256: hex(await crypto.subtle.digest('SHA-256', artifactBytes)), 'max-bytes': 65536 });
  await rt.mountRestrictedClientApp({ artifact, container: document.getElementById('app'), broker, hostLocal });
  window.hostLocal = hostLocal;
};
// What is on disk in this origin's IndexedDB: does any stored value contain the marker in plaintext?
window.rawContainsMarker = () => new Promise((resolve) => {
  const open = indexedDB.open('kotoba-client-host-storage-v1');
  open.onsuccess = () => {
    const tx = open.result.transaction('kv', 'readonly'); const all = tx.objectStore('kv').getAll();
    all.onsuccess = () => {
      const marker = new TextEncoder().encode(MARKER);
      const has = (bytes) => { for (let i = 0; i + marker.length <= bytes.length; i++) if (marker.every((m, j) => bytes[i + j] === m)) return true; return false; };
      const values = all.result;
      resolve({ records: values.length, plaintext: values.some((v) => v?.data instanceof Uint8Array && has(v.data)),
        keys: values.filter((v) => v instanceof CryptoKey).map((k) => ({ extractable: k.extractable, algorithm: k.algorithm.name })) });
    };
  };
});
window.ready = true;
</script>
