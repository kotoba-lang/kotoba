<!doctype html><meta charset="utf-8"><title>Synthetic response cancellation</title><p>Click the guest button, then Allow (許可) in the consent dialog. The response body never ends; the host closes the guest while reading it.</p><p id="state">preparing</p><main></main><script type="module">
import {verifyClientArtifact,mountRestrictedClientApp,createClientConsentHost,createClientOperationBroker} from '../../src/kotoba-client-runtime.js';
const state=document.querySelector('#state');let mount;
const op={capability:'test/read',service:'synthetic',operation:'read',consent:'each-operation',disclosure:{recipient:'テスト用の送り先（合成）',country:'JP',data:['テスト用の合成データ'],'special-care':false,purpose:'テストのため',frequency:'one-time',withdrawal:'テストのため取り消しの設定はありません'},'data-categories':['synthetic'],endpoint:{origin:'https://fixture.invalid',method:'GET',path:'/x'}};
const runtime={schema:'kotoba.app.client-runtime.v1',target:'browser',profile:'restricted-wasm-v1',entry:'app.html','local-state':{adapter:'memory',schema:'s',version:1},operations:[op]};
const guest=`<button id="go">Request response</button><script>addEventListener('message',e=>{if(e.data.protocol!=='kotoba.client.host.v1')return;const port=e.ports[0];document.querySelector('#go').onclick=()=>port.postMessage({protocol:'kotoba.client.operation.v1',id:'one',selector:{capability:'test/read',service:'synthetic',operation:'read'},payload:{input:'https://fixture.invalid/x'}})});<\/script>`;
const b=new TextEncoder().encode(guest);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
const artifact=await verifyClientArtifact(b,{revision:'1'.repeat(40),sha256:hash,'max-bytes':4096});
// R4: a canonical broker over a synthetic fetch (captured at creation) instead of a bespoke broker object.
const realFetch=globalThis.fetch;
globalThis.fetch=async()=>{const r=new Response(new ReadableStream({pull(){state.textContent='reading';setTimeout(()=>{mount.close();state.textContent+=' / closed'},0);return new Promise(()=>{})},cancel(){state.textContent+=' / cancelled'}},{highWaterMark:0}));Object.defineProperty(r,'url',{value:'https://fixture.invalid/x'});return r;};
const broker=createClientOperationBroker({runtime,requestedCapabilities:[op.capability],approvedOperations:[op],hostSupportedOperations:[[op.capability,op.service,op.operation]],consentHost:createClientConsentHost()});
globalThis.fetch=realFetch;
mount=await mountRestrictedClientApp({artifact,container:document.querySelector('main'),broker});state.textContent='ready';
</script>
