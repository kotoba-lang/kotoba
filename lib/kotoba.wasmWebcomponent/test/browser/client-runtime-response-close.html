<!doctype html><meta charset="utf-8"><title>Synthetic response cancellation</title><p id="state">preparing</p><main></main><script type="module">
import {verifyClientArtifact,mountRestrictedClientApp} from '../../src/kotoba-client-runtime.js';
const state=document.querySelector('#state');let mount;
const guest=`<button id="go">Request response</button><script>addEventListener('message',e=>{if(e.data.protocol!=='kotoba.client.host.v1')return;const port=e.ports[0];document.querySelector('#go').onclick=()=>port.postMessage({protocol:'kotoba.client.operation.v1',id:'one',selector:{},payload:{}})});<\/script>`;
const b=new TextEncoder().encode(guest);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
const artifact=await verifyClientArtifact(b,{revision:'1'.repeat(40),sha256:hash,'max-bytes':4096});
const broker={invoke(){return new Response(new ReadableStream({pull(){state.textContent='reading';setTimeout(()=>{mount.close();state.textContent+=' / closed'},0);return new Promise(()=>{})},cancel(){state.textContent+=' / cancelled'}},{highWaterMark:0}))}};
mount=await mountRestrictedClientApp({artifact,container:document.querySelector('main'),broker});state.textContent='ready';
</script>
