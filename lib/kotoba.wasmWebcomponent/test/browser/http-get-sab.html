<!doctype html>
<meta charset="utf-8">
<title>Kotoba SAB HTTP GET E2E</title>
<main id="result">running</main>
<script type="module">
  import { attachSabHttpGetBridge, attachSabHttpPostBridge } from '../../src/http-sab-bridge.js';
  const result = document.querySelector('#result');
  const worker = new Worker('/test/browser/http-get-worker.js', { type: 'module' });
  const detach = attachSabHttpGetBridge(worker, async (request) => {
    if (JSON.stringify(request) !== JSON.stringify({
      host: 'example.test', port: 443, path: '/bounded', maxBytes: 128, redirect: 'manual'
    })) throw new Error('request scope mismatch');
    await Promise.resolve();
    return new TextEncoder().encode('HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nok');
  });
  const detachPost = attachSabHttpPostBridge(worker, async (request) => {
    if (request.url !== 'https://api.example.test/v1/messages' ||
        new TextDecoder().decode(request.body) !== 'hello' ||
        request.redirect !== 'manual') throw new Error('POST request scope mismatch');
    return new TextEncoder().encode('posted');
  });
  worker.addEventListener('message', (event) => {
    if (event.data?.type !== 'result') return;
    result.dataset.ok = String(event.data.ok);
    result.textContent = event.data.ok ? `${event.data.text}\n${event.data.postText}` : event.data.error;
    detach();
    detachPost();
    worker.terminate();
  });
  worker.addEventListener('error', (event) => {
    result.dataset.ok = 'false';
    result.textContent = `${event.message} @ ${event.filename}:${event.lineno}`;
    detach();
    detachPost();
    worker.terminate();
  });
</script>
