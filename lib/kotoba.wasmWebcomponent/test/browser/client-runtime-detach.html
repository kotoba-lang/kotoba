<!doctype html><meta charset="utf-8"><title>Consent and CSP synthetic probe</title><h1>Consent and CSP synthetic probe</h1><p id="state">preparing</p><p id="lifecycle">guest open</p><main></main>
<script type="module">
import {createClientConsentHost,createClientOperationBroker,verifyClientArtifact,mountRestrictedClientApp} from '../../src/kotoba-client-runtime.js';
const op={capability:'test/browser-counter',service:'local-fixture',operation:'increment',consent:'each-operation','data-categories':['fixture-number'],endpoint:{origin:'https://fixture.invalid','browser-action':'test/counter'}};
const runtime={schema:'kotoba.app.client-runtime.v1',target:'browser',profile:'restricted-wasm-v1',entry:'app.html','local-state':{adapter:'localstorage',schema:'test.state.v1',version:1},workers:[],operations:[op]};
let calls=0; const state=document.querySelector('#state');
try {
const consentHost=createClientConsentHost();
const broker=createClientOperationBroker({runtime,requestedCapabilities:[op.capability],approvedOperations:[op],hostSupportedOperations:[[op.capability,op.service,op.operation]],consentHost,browserAdapters:{'local-fixture':{increment:({payload})=>{state.textContent='handler calls '+(++calls);return {value:payload.value};}}}});
const guest=`<button id="go">Request synthetic operation</button><p id="result">waiting</p><script>let port, n=0;addEventListener('message', e=>{if(e.data.protocol!=='kotoba.client.host.v1'||e.ports.length!==1)return;port=e.ports[0];port.onmessage=e=>document.getElementById('result').textContent=e.data.ok?'approved result '+e.data.result.value:'denied '+e.data.error;});document.getElementById('go').onclick=()=>{port.postMessage({protocol:'kotoba.client.operation.v1',id:'request-'+(++n),selector:{capability:'test/browser-counter',service:'local-fixture',operation:'increment'},payload:{value:1}})};<\/script>`;
const bytes=new TextEncoder().encode(guest), digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
const artifact=await verifyClientArtifact(bytes,{revision:'1111111111111111111111111111111111111111',sha256:digest,'max-bytes':1048576});
const wrapped={invoke(...args){const result=broker.invoke(...args);queueMicrotask(()=>{document.querySelector('main iframe').remove();document.querySelector('#lifecycle').textContent='guest detached while awaiting consent';});return result;}};await mountRestrictedClientApp({artifact,container:document.querySelector('main'),broker:wrapped});state.textContent='handler calls 0';
}catch(e){state.textContent='SETUP FAILED '+e.message}
</script>
