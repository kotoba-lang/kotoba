<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Streamed artifact qualification</title>
<script type="module">
// Streamed (host-stream) artifacts through the canonical broker. Driven by verify-artifact-stream.mjs:
// the runner fakes the artifact hosts with the DevTools Fetch domain and clicks the consent dialog with
// trusted input. No real service is contacted.
import { clientRuntimeProblems, createClientConsentHost, createClientOperationBroker, verifyClientArtifact } from '/src/kotoba-client-runtime.js';
const fixture = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const op = (path, extra = {}) => ({ capability: 'test/model-artifact', service: 'artifact-fixture', operation: path.slice(1), consent: 'each-operation', disclosure:{recipient:'テスト用の送り先（合成）',country:'JP',data:['テスト用の合成データ'],'special-care':false,purpose:'テストのため',frequency:'one-time',withdrawal:'テストのため取り消しの設定はありません'},
  'data-categories': ['public-model-file'], endpoint: { origin: 'https://artifacts.invalid', method: 'GET', path },
  'redirect-origins': ['https://*.cdn.invalid'],
  artifact: { revision: 'a'.repeat(40), sha256: fixture.sha256, 'max-bytes': fixture.size, delivery: 'host-stream' }, ...extra });
const ops = {
  good: op('/model'), bad: op('/model-bad'), elsewhere: op('/model-elsewhere'),
  big: { ...op('/model-big'), artifact: { revision: 'a'.repeat(40), sha256: fixture.sha256, 'max-bytes': fixture.size - 1, delivery: 'host-stream' } },
  nosink: { ...op('/model-nosink'), service: 'no-sink-fixture' },
};
const runtime = { schema: 'kotoba.app.client-runtime.v1', target: 'browser', profile: 'trusted-page-v1', entry: 'app.html',
  'local-state': { adapter: 'memory', schema: 'test.state.v1', version: 1 }, workers: [], operations: Object.values(ops) };
const log = { created: 0, writes: 0, written: 0, closes: [], aborts: [] };
const sink = () => async ({ artifact }) => {
  log.created++;
  return { write: async (chunk) => { log.writes++; log.written += chunk.byteLength; },
           close: async (summary) => { log.closes.push(summary); return { stored: 'fixture.bin', bytes: summary.bytes }; },
           abort: async (reason) => { log.aborts.push(reason); } };
};
const artifactSinks = { 'artifact-fixture': { model: sink(), 'model-bad': sink(), 'model-elsewhere': sink(), 'model-big': sink() } };
const consentHost = createClientConsentHost();
const broker = createClientOperationBroker({ runtime, requestedCapabilities: ['test/model-artifact'], approvedOperations: runtime.operations,
  hostSupportedOperations: runtime.operations.map((o) => [o.capability, o.service, o.operation]), consentHost, artifactSinks });
const sel = (o) => ({ capability: o.capability, service: o.service, operation: o.operation });
window.declarations = async () => {
  const base = op('/model');
  const problems = (o) => clientRuntimeProblems({ ...runtime, operations: [o] }, ['test/model-artifact']).length;
  let refusedInMemory = false; try { await verifyClientArtifact(new Uint8Array(3), base.artifact); } catch { refusedInMemory = true; }
  return {
    streamedLarge: problems({ ...base, artifact: { ...base.artifact, 'max-bytes': 2 * 1024 ** 3 } }),
    inMemoryLarge: problems({ ...base, artifact: { revision: base.artifact.revision, sha256: base.artifact.sha256, 'max-bytes': 2 * 1024 ** 3 } }),
    unknownDelivery: problems({ ...base, artifact: { ...base.artifact, delivery: 'push' } }),
    overStreamCap: problems({ ...base, artifact: { ...base.artifact, 'max-bytes': 64 * 1024 ** 3 + 1 } }),
    refusedInMemory,
  };
};
window.run = async (name) => {
  Object.assign(log, { created: 0, writes: 0, written: 0, closes: [], aborts: [] });
  try { const result = await broker.invoke(sel(ops[name]), { input: `https://artifacts.invalid/${ops[name].endpoint.path.slice(1)}` });
        return { ok: true, result: JSON.parse(JSON.stringify(result)), log: JSON.parse(JSON.stringify(log)) }; }
  catch (error) { return { ok: false, error: String(error.message), log: JSON.parse(JSON.stringify(log)) }; }
};
window.ready = true;
</script></head><body><main><h1>Streamed artifact qualification</h1></main></body></html>
