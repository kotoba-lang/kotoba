name: Kotoba UX Kaizen Gate
description: Run the deterministic design-quality gate for a rendered application.
inputs:
  html:
    description: Rendered HTML file or directory to score.
    required: true
  minimum:
    description: Minimum deterministic score.
    required: false
    default: "95"
  design-quality-ref:
    description: Pinned kotoba-lang/design-quality revision.
    required: false
    default: fb766e2f79c088de05e289554c9de049e7909bd3
runs:
  using: composite
  steps:
    - uses: turtlequeue/setup-babashka@v1.7.0
      with:
        babashka-version: 1.12.206
    - uses: actions/checkout@v4
      with:
        repository: kotoba-lang/design-quality
        ref: ${{ inputs.design-quality-ref }}
        path: .ux-kaizen/design-quality
    - name: Deterministic UX gate
      shell: bash
      run: >-
        kbb --classpath .ux-kaizen/design-quality/src
        -m design-quality.cli score "${{ inputs.html }}"
        --min "${{ inputs.minimum }}"
