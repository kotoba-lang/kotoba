# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  default: mishima
  key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  max_tokens: 1024
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
fallback_providers: []
web:
  backend: nous
browser:
  cloud_provider: nous
context_file_max_chars: 120000
auxiliary:
  free_only: true
  vision:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    model: qwen3-vl-2b-instruct
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  web_extract:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  compression:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  skills_hub:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  approval:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  mcp:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  title_generation:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  triage_specifier:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
dashboard:
  turn_isolation: true
tts:
  provider: nous
wake_word:
  enabled: false
moa:
  presets:
    default:
      reference_models:
      - provider: murakumo
        model: mishima
        enabled: true
        base_url: https://api.murakumo.cloud/v1
        key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
      aggregator:
        provider: murakumo
        model: mishima
        base_url: https://api.murakumo.cloud/v1
        key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
  - provider: murakumo
    model: mishima
    enabled: true
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  aggregator:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
plugins:
  enabled: []
gateway:
  multiplex_profiles: true
_config_version: 46
image_gen:
  provider: nous
agent:
  max_turns: 500
  run_budget_seconds: 600
cron:
  bot_chat_delivery_timeout_seconds: 900
  max_parallel_jobs: 12
mcp_servers:
  github-forest:
    command: /opt/homebrew/bin/node
    args:
    - ~/github/com-junkawasaki/west-manifest/scripts/forest-maintenance.mjs
    - mcp
    lazy: true
