name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - run: npm install -g nbb

      # nbb rather than `cljs.main -re node`: that runner does not
      # propagate the script's exit code, so a failing suite exited 0 and
      # this gate would have been green forever. Checked by breaking a
      # check on purpose.
      - name: contract + adapter checks
        run: nbb --classpath "$(clojure -Spath -M:cljs-test)" test/run.cljk
