name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # A real server, because everything this backend claims lives in the
    # SQL. The unit suite can only check that `open` rejects a missing
    # datasource; `:linearizable-ref` is only meaningful against postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kotobase
          POSTGRES_PASSWORD: kotobase
          POSTGRES_DB: kotobase
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U kotobase"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - run: clojure -M:test
      - run: clojure -M:test:integration
