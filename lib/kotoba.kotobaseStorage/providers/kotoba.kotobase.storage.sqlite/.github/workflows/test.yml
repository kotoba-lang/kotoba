name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      # Real SQLite files in a temp dir, and four JVM threads racing the
      # conditional UPDATE, so the runner's own SQLite build is part of
      # what is under test.
      - run: clojure -M:test
