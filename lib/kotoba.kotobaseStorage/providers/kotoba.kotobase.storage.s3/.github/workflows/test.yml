name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - run: npm ci

      # nbb rather than `cljs.main -re node`: that runner does not
      # propagate the script's exit code, so a failing suite exited 0 and
      # this gate would have been green forever. Checked by breaking a
      # check on purpose.
      # Three suites. The second runs the contract through `r2-client`
      # against a real R2Bucket binding -- a path the mock never touches,
      # and the one that found the probe sending a quoted ETag R2 rejects
      # outright. The third runs the engine's Datalog surface over that
      # same binding, because passing the storage contract does not by
      # itself mean transact/q reach the bucket.
      # Four suites now. The last compiles at :optimizations :advanced --
      # what a Workers build ships, and the only configuration in which
      # this repo has had a production bug: Closure renamed the R2 binding's
      # `.etag`, every ref lost its version, and the CAS degraded to an
      # unconditional PUT. Every other suite ran unoptimised and passed.
      - name: contract + adapter + engine + advanced build
        run: npm test

      # The large-object plane. Its own suite because the storage contract
      # above is about blocks and refs, and because the property that
      # matters here cannot be asserted by a contract at all: this step
      # signs with real WebCrypto and reads X-Amz-SignedHeaders back out of
      # the URL S3 would verify against. A provider can report signing
      # content-length while signing only host, and every grant would be a
      # blank cheque with a conforming shape.
      - name: large-object plane
        run: npm run test:objects
