<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script src="/grade-proof-bundle.js"></script>
<script>
window.runGradeProof = async function () {
  const wc = w3.webcodecs;
  const ge = kami.eizo.grade.e2e.entry;
  const W = 64, H = 64;

  // Same four-quadrant idea as org-w3-webcodecs's own E2E / kami-eizo-timeline's
  // per-clip colors: distinct solid colors, large uniform regions survive lossy
  // H.264 compression well enough for a tight pixel-tolerance check.
  const quadrants = {
    TL: [230, 20, 20],   // red
    TR: [20, 200, 20],   // green
    BL: [20, 20, 230],   // blue
    BR: [230, 220, 20]   // yellow
  };

  function paintQuadrants(ctx, colors) {
    ctx.fillStyle = 'rgb(' + colors.TL.join(',') + ')'; ctx.fillRect(0, 0, W / 2, H / 2);
    ctx.fillStyle = 'rgb(' + colors.TR.join(',') + ')'; ctx.fillRect(W / 2, 0, W / 2, H / 2);
    ctx.fillStyle = 'rgb(' + colors.BL.join(',') + ')'; ctx.fillRect(0, H / 2, W / 2, H / 2);
    ctx.fillStyle = 'rgb(' + colors.BR.join(',') + ')'; ctx.fillRect(W / 2, H / 2, W / 2, H / 2);
  }

  function avgQuadrant(ctx, x0, y0, w, h) {
    const d = ctx.getImageData(x0, y0, w, h).data;
    let r = 0, g = 0, b = 0, n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  }

  function avgAllQuadrants(ctx) {
    return {
      TL: avgQuadrant(ctx, 0, 0, W / 2, H / 2),
      TR: avgQuadrant(ctx, W / 2, 0, W / 2, H / 2),
      BL: avgQuadrant(ctx, 0, H / 2, W / 2, H / 2),
      BR: avgQuadrant(ctx, W / 2, H / 2, W / 2, H / 2)
    };
  }

  function close(a, b, tol) {
    return Math.abs(a[0] - b[0]) <= tol && Math.abs(a[1] - b[1]) <= tol && Math.abs(a[2] - b[2]) <= tol;
  }

  async function encodeDecodeRoundTrip(colors) {
    const src = document.createElement('canvas');
    src.width = W; src.height = H;
    const sctx = src.getContext('2d');
    paintQuadrants(sctx, colors);

    const frame = wc.make_video_frame(src, { timestamp: 0 });
    const encodedChunks = [];
    let decoderConfigFromEncoder = null;
    const encoder = wc.make_video_encoder({
      output: (chunk, metadata) => {
        encodedChunks.push(chunk);
        if (metadata && metadata.decoderConfig) decoderConfigFromEncoder = metadata.decoderConfig;
      },
      error: (e) => { throw e; }
    });
    wc.configure_video_encoder_BANG_(encoder, {
      codec: 'avc1.42001f',
      width: W, height: H,
      bitrate: 2_000_000,
      framerate: 30,
      avc: { format: 'avc' }
    });
    wc.encode_video_frame_BANG_(encoder, frame, { keyFrame: true });
    await wc.video_encoder_flush_BANG_(encoder);
    wc.close_video_encoder_BANG_(encoder);
    wc.close_video_frame_BANG_(frame);

    if (encodedChunks.length === 0) throw new Error('no encoded chunks produced');
    if (!decoderConfigFromEncoder) throw new Error('no decoder config emitted by encoder');

    const decodedFrames = [];
    const decoder = wc.make_video_decoder({
      output: (f) => decodedFrames.push(f),
      error: (e) => { throw e; }
    });
    wc.configure_video_decoder_BANG_(decoder, {
      codec: decoderConfigFromEncoder.codec,
      codedWidth: decoderConfigFromEncoder.codedWidth,
      codedHeight: decoderConfigFromEncoder.codedHeight,
      description: decoderConfigFromEncoder.description
    });
    for (const chunk of encodedChunks) wc.decode_video_chunk_BANG_(decoder, chunk);
    await wc.video_decoder_flush_BANG_(decoder);
    wc.close_video_decoder_BANG_(decoder);

    if (decodedFrames.length === 0) throw new Error('no decoded frames produced');
    const decoded = decodedFrames[0];

    const dst = document.createElement('canvas');
    dst.width = W; dst.height = H;
    const dctx = dst.getContext('2d');
    dctx.drawImage(decoded, 0, 0);
    decoded.close();

    return avgAllQuadrants(dctx);
  }

  // --- Stage 1: real encode -> decode of the ungraded test image. These are
  // REAL decoded H.264 pixel values (slightly lossy vs. the painted input),
  // not synthetic numbers -- this is the input the grading math below runs on.
  const decodedBeforeGrading = await encodeDecodeRoundTrip(quadrants);

  // --- Stage 2: apply kami-eizo-grade's real (compiled-into-this-bundle) CDL
  // transform to those real decoded pixels, in-browser.
  const gradedByBrowser = {};
  for (const k of Object.keys(decodedBeforeGrading)) {
    const [r, g, b] = decodedBeforeGrading[k];
    gradedByBrowser[k] = Array.from(ge.graded_rgb255_js(r, g, b));
  }

  // --- Stage 3: full real round-trip -- re-encode the graded quadrant colors
  // and decode them back again, proving the CDL-graded pixels themselves
  // survive a second real H.264 encode/decode pass, not just the arithmetic.
  const decodedAfterRegrade = await encodeDecodeRoundTrip(gradedByBrowser);

  const tolCodec = 40;   // H.264 lossy compression tolerance (matches org-w3-webcodecs's own E2E)
  const regradeOk = {};
  let regradePass = true;
  for (const k of Object.keys(gradedByBrowser)) {
    const ok = close(decodedAfterRegrade[k], gradedByBrowser[k], tolCodec);
    regradeOk[k] = ok;
    if (!ok) regradePass = false;
  }

  return {
    quadrantsPainted: quadrants,
    decodedBeforeGrading: decodedBeforeGrading,
    gradedByBrowser: gradedByBrowser,
    decodedAfterRegrade: decodedAfterRegrade,
    regradeOk: regradeOk,
    regradePass: regradePass,
    tolCodec: tolCodec
  };
};
</script>
</body></html>
