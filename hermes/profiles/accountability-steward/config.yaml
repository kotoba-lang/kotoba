# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
model:
  max_tokens: 8192
  provider: murakumo
  default: murakumo/free
  base_url: https://api.murakumo.cloud/v1
providers:
  murakumo:
    models:
      mishima:
        context_length: 131072
        max_tokens: 1024
      nex-n2.5-mini-uncensored:
        context_length: 65536
        max_tokens: 8192
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-OpenRouter-Title: Itonami By KotobaLabs
      X-Title: Itonami By KotobaLabs
  openrouter-free:
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
    key_env: OPENROUTER_API_KEY
    stale_timeout_seconds: 600
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-OpenRouter-Title: Itonami By KotobaLabs
      X-Title: Itonami By KotobaLabs
  custom:
    models:
      glm-5.3-flash-cybersecurity-w4a16:
        stale_timeout_seconds: 2400
        timeout_seconds: 2400
      qwen3.8-flash-next-cybersecurity-nvfp4:
        stale_timeout_seconds: 2000
        timeout_seconds: 2000
  kotoba:
    base_url: https://api.kotoba.cloud/v1
    api_mode: chat_completions
    key_env: KOTOBA_API_TOKEN
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    models:
      qwen3.8-27b-whitehacker:
        context_length: 262144
      qwen3.8-flash-next-whitehacker:
        context_length: 131072
web:
  backend: nous
browser:
  cloud_provider: nous
context_file_max_chars: 120000
auxiliary:
  free_only: true
  vision:
    reasoning_effort: none
  web_extract: {}
  compression:
    reasoning_effort: none
  skills_hub: {}
  approval: {}
  mcp: {}
  title_generation:
    reasoning_effort: none
  triage_specifier: {}
dashboard:
  turn_isolation: true
tts:
  provider: nous
wake_word:
  enabled: false
moa:
  presets:
    default:
      reference_models:
        - provider: kotoba
          model: qwen3.8-27b-whitehacker
          enabled: true
      aggregator:
        provider: opencode-free
        model: deepseek-v4-flash-free
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: kotoba
      model: qwen3.8-27b-whitehacker
      enabled: true
  aggregator:
    provider: opencode-free
    model: deepseek-v4-flash-free
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
plugins:
  enabled: []
gateway:
  cron_only: true
  multiplex_profiles: true
_config_version: 51
image_gen:
  provider: nous
agent:
  max_turns: 500
  run_budget_seconds: 600



cron:
  max_parallel_jobs: 12

