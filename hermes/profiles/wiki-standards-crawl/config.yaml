# Hermes uses the configured OpenRouter rail; native inference belongs to Itonami.
model:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  default: xiaomi/mimo-v2.6-pro
  max_tokens: 8192
  context_length: 131072
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
    key_env: OPENROUTER_API_KEY
plugins:
  enabled: []
_config_version: 46
agent:
  max_turns: 500
  run_budget_seconds: 600
fallback_providers: []
auxiliary:
  free_only: true
  vision:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    model: xiaomi/mimo-v2.6-pro
    reasoning_effort: none
  web_extract:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    key_env: OPENROUTER_API_KEY
  compression:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    reasoning_effort: none
    key_env: OPENROUTER_API_KEY
  skills_hub:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    key_env: OPENROUTER_API_KEY
  approval:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    key_env: OPENROUTER_API_KEY
  mcp:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    key_env: OPENROUTER_API_KEY
  title_generation:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    reasoning_effort: none
    key_env: OPENROUTER_API_KEY
  triage_specifier:
    base_url: https://openrouter.ai/api/v1
    model: xiaomi/mimo-v2.6-pro
    provider: openrouter
    key_env: OPENROUTER_API_KEY
cron:
  bot_chat_delivery_timeout_seconds: 900
  max_parallel_jobs: 12
gateway:
  cron_only: true
