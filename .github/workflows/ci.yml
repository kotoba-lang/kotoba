name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-selfhost:
    name: Amu selfhost and Kotoba CLI requests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kotoba-lang/amu
          ref: ce982703375bedc0039b61b1a821407d228ea98a
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kotoba-lang/kotoba-lang
          ref: 5dbea46310591154765eeb0ef289bb98ca77a401
          path: _native/contract
          persist-credentials: false
      - name: Rebuild from the loaderless Amu root
        run: python3 _native/amu/scripts/seed/selfhost-bootstrap.py --tier pr --output "$RUNNER_TEMP/boot"
      - name: Verify the combined compiler and produce the native controller inputs
        run: python3 _native/amu/scripts/seed/check-one-compiler.py --bootstrap "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/one"
      - name: All12 CLI request flags, aliases and refusals (Kotoba assertions)
        run: python3 scripts/check-native-cli-request.py --amu "$PWD/_native/amu" --contract "$PWD/_native/contract/lang/cli.edn" --compiler "$RUNNER_TEMP/one/F2.elf" --output "$RUNNER_TEMP/cli-request"
      # KOTOBA-174: the passing native bootstrap's receipt and F, for the
      # separate wasm32-browser job. No native job depends on that job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotoba-native-bootstrap-arm64
          path: |
            ${{ runner.temp }}/boot/selfhost-bootstrap.json
            ${{ runner.temp }}/boot/F*.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotoba-native-controller-inputs
          path: |
            ${{ runner.temp }}/one/one-compiler.json
            ${{ runner.temp }}/one/F-x86_64.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kotoba-native-arm-evidence
          path: |
            ${{ runner.temp }}/boot/selfhost-bootstrap.json
            ${{ runner.temp }}/boot/calls.json
            ${{ runner.temp }}/one/one-compiler.json
            ${{ runner.temp }}/one/calls.json
            ${{ runner.temp }}/cli-request/native-cli-request.json
            ${{ runner.temp }}/cli-request/calls.json
            ${{ runner.temp }}/cli-request/*.stdout
            ${{ runner.temp }}/cli-request/*.stderr
          if-no-files-found: warn

  # KOTOBA-174 (amu ce982703): the wasm32-browser target is one build target,
  # outside the native qualification, following amu's job split. It compiles
  # with the F of the passing native bootstrap, checked against its receipt.
  # No native job needs this job.
  wasm32-browser-target:
    name: wasm32-browser target (compile, arm64)
    needs: native-selfhost
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kotoba-lang/amu
          ref: ce982703375bedc0039b61b1a821407d228ea98a
          path: _native/amu
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kotoba-native-bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - name: F's wasm32-browser modules of the runtime cases and probes, float refusals
        run: python3 _native/amu/scripts/seed/selfhost-bootstrap.py --wasm32-browser --bootstrap "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/wasm32-target"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotoba-wasm32-browser-modules
          path: |
            ${{ runner.temp }}/wasm32-target/wasm32-browser-target.json
            ${{ runner.temp }}/wasm32-target/calls.json
            ${{ runner.temp }}/wasm32-target/wasm32/*.wasm
          if-no-files-found: error

  native-controller:
    name: Amu and Kotoba native controller (x86)
    needs: native-selfhost
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kotoba-lang/amu
          ref: ce982703375bedc0039b61b1a821407d228ea98a
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kotoba-lang/kotoba-lang
          ref: 5dbea46310591154765eeb0ef289bb98ca77a401
          path: _native/contract
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kotoba-native-controller-inputs
          path: ${{ runner.temp }}/one
      - name: Rebuild complete x86 compiler and sealed native roles
        run: python3 _native/amu/scripts/seed/check-complete-x86.py --compiler "$RUNNER_TEMP/one/F-x86_64.elf" --arm-proof "$RUNNER_TEMP/one/one-compiler.json" --output "$RUNNER_TEMP/complete"
      - name: Controller positive, refusal and child cleanup checks
        run: python3 _native/amu/scripts/seed/check-native-cdci.py --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/cdci"
      # KOTOBA-174: BLOCKED at amu ce982703. The x86 compiler admits the
      # CID-locked sources, but no x86_64-linux route compiles a locked
      # project with capability calls (kx64-v1 refuses them, E7101), so the
      # fixture does not execute on x86. The step asserts that refusal and
      # writes status BLOCKED_NATIVE_X86_CLI_REQUEST_EXECUTION; it turns red
      # when Amu gains the route. The ARM job executes every control.
      - name: Native x86 CLI request: CID-locked compile; execution BLOCKED (KOTOBA-174)
        run: python3 scripts/check-native-cli-request.py --amu "$PWD/_native/amu" --contract "$PWD/_native/contract/lang/cli.edn" --compiler "$RUNNER_TEMP/complete/F3.elf" --output "$RUNNER_TEMP/cli-request-x86"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kotoba-native-x86-evidence
          path: |
            ${{ runner.temp }}/complete/complete-x86.json
            ${{ runner.temp }}/complete/calls.json
            ${{ runner.temp }}/cdci/native-cdci.json
            ${{ runner.temp }}/cdci/calls.json
            ${{ runner.temp }}/cdci/positive/*.receipt
            ${{ runner.temp }}/cli-request-x86/native-cli-request.json
            ${{ runner.temp }}/cli-request-x86/calls.json
            ${{ runner.temp }}/cli-request-x86/*.stdout
            ${{ runner.temp }}/cli-request-x86/*.stderr
          if-no-files-found: warn

  required-ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [native-selfhost, native-controller]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native qualification jobs
        env:
          NATIVE_RESULT: ${{ needs.native-selfhost.result }}
          CONTROLLER_RESULT: ${{ needs.native-controller.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$CONTROLLER_RESULT" = success
