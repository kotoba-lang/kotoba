name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-selfhost:
    name: Native selfhost gates
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned selfhost compiler and bootstrap
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/amu
          ref: 1b0687a5997c35fec1d3903840eecc76b934589e
          path: _native/amu
          persist-credentials: false
      - name: Checkout pinned portable bytes sources
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/bytes
          ref: 04019b9805b79095a5636404106288fc259fac3c
          path: _native/bytes
          persist-credentials: false
      - name: Deny hosted language executables
        shell: bash
        run: |
          set -euo pipefail
          blocked="$RUNNER_TEMP/kotoba-forbidden-hosts"
          mkdir "$blocked"
          for name in java javac clojure clj bb node nbb kbb npm native-image python python3; do
            cat > "$blocked/$name" <<'SH'
          #!/bin/sh
          printf '%s\n' "$0" >> "${0%/*}/used"
          exit 97
          SH
            chmod +x "$blocked/$name"
          done
          echo "$blocked" >> "$GITHUB_PATH"
      - name: Self-build three native compiler generations
        shell: bash
        run: bash scripts/build-selfhost-toolchain.sh --amu-source "$PWD/_native/amu" --output "$RUNNER_TEMP/selfhost-toolchain"
      - name: Build and execute the complete native runtime fixture
        shell: bash
        run: bash scripts/test-selfhost-runtime.sh "$RUNNER_TEMP/selfhost-toolchain" "$PWD/_native/amu/src" "$PWD/_native/bytes/src" "$RUNNER_TEMP/native-runtime"
      - name: Verify no hosted language executable ran
        if: ${{ !cancelled() }}
        shell: bash
        run: test ! -e "$RUNNER_TEMP/kotoba-forbidden-hosts/used"
      - name: Preserve native source and execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-selfhost-evidence
          path: |
            ${{ runner.temp }}/selfhost-toolchain/report.json
            ${{ runner.temp }}/selfhost-toolchain/host/*.stdout
            ${{ runner.temp }}/selfhost-toolchain/host/*.stderr
            ${{ runner.temp }}/native-runtime/report.json
            ${{ runner.temp }}/native-runtime/sources.sha256
            ${{ runner.temp }}/native-runtime/logs/*
  clj-launcher:
    name: CLJ launcher gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned language qualification authority
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotoba-lang
          ref: 1266ae1daedd579021e07b6097326633f3877704
          path: _authority/kotoba-lang
          persist-credentials: false
      - name: Checkout pinned Amu qualification evidence
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/amu
          ref: 249b9408d236d6766d04794d6a3cb04cb894b7dc
          path: _evidence/amu
          persist-credentials: false
      - name: Checkout pinned kototama qualification evidence
        uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kototama
          ref: d96f717b202830a1a50a28fb3b59a811987cfcdb
          path: _evidence/kototama
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # deps.edn git deps + maven jars dominate the CLJ gate wall time
      # (measured: ~11 min of downloads per cold run). Cache them.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'nbb.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: "1.12.218"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare immutable SCI and native subprocess hosts
        run: bash scripts/setup-clj-ci-runtime.sh
      - name: Checkout contract siblings (deps.edn :local/root)
        run: |
          mkdir -p ../../kotoba-lang
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-core-contracts ../../kotoba-lang/kotoba-core-contracts
          git clone --depth 1 https://github.com/kotoba-lang/kotoba-selfhost-contracts ../../kotoba-lang/kotoba-selfhost-contracts
          git clone --depth 1 https://github.com/kotoba-lang/cacao ../../kotoba-lang/cacao
          git clone --depth 1 https://github.com/kotoba-lang/ed25519 ../../kotoba-lang/ed25519
          git clone --depth 1 https://github.com/kotoba-lang/dag-cbor ../../kotoba-lang/dag-cbor
          # q8-report-is-machine-checkable-and-does-not-overclaim asserts that
          # every evidence path the backend-qualification report cites really
          # exists, and six of them live in these two siblings. Without the
          # clones the test fails in CI for a reason that has nothing to do with
          # the report -- measured locally: 6 failures without them, 0 with.
          # It has been invisible because the security-adoption step above exits
          # first, so the suite never runs.
          git clone --depth 1 https://github.com/kotoba-lang/amu ../amu
          git clone --depth 1 https://github.com/kotoba-lang/kototama ../kototama
      - if: ${{ !cancelled() }}
        name: Verify bundled source provenance
        run: node scripts/check-libraries.mjs
      - if: ${{ !cancelled() }}
        name: Test portable libraries and Kotoba naming conformance
        run: node scripts/test-libraries.mjs
      - if: ${{ !cancelled() }}
        name: Verify Lexicon names and the language-owned naming spec
        run: node scripts/test-libraries.mjs --check-design
      # Every step below carries `if: ${{ !cancelled() }}` so that one failure
      # reports itself without removing the others from the run. This job has
      # already been bitten once by the default: the comment above records that
      # the evidence clones were missing "invisibly because the
      # security-adoption step above exits first, so the suite never runs".
      # The setup steps are deliberately NOT guarded -- with no toolchain and no
      # sibling checkouts the rest would fail for reasons that say nothing.
      - if: ${{ !cancelled() }}
        name: Verify shared security adoption
        run: |
          node scripts/prepare-jvm-analysis.mjs
          clojure -M -i tools/cljk_loader.cljk -e "(require 'kotoba.security.adoption) (kotoba.security.adoption/verify! \".jvm-analysis\")"
      - if: ${{ !cancelled() }}
        name: Test CLJ launcher
        run: clojure -M:test
        env:
          KOTOBA_LANG_AUTHORITY_ROOT: ${{ github.workspace }}/_authority/kotoba-lang
          KOTOBA_COMPILER_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/amu
          KOTOTAMA_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/kototama
      # The Q9 wave-1 pilot names `clojure -M:qualification` as its verification
      # command, and nothing ran it: `grep -n '\-M:qualification'` across this
      # repository matched exactly one line, the pilot record's own :command.
      # Its assertions do run -- backend-qualification-test is in the suite
      # above -- but the command that produces the report, and with it anything
      # a soak could count, did not. Measured 2026-08-19 with these same three
      # roots: 10 tests, 103 assertions, 0 failures. Without them it is 9
      # failures, all of them evidence paths that resolve only beside a sibling
      # checkout, which is why this step sets them rather than trusting layout.
      - if: ${{ !cancelled() }}
        name: Run the Q9 wave-1 pilot's declared command
        run: clojure -M:qualification
        env:
          KOTOBA_LANG_AUTHORITY_ROOT: ${{ github.workspace }}/_authority/kotoba-lang
          KOTOBA_COMPILER_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/amu
          KOTOTAMA_EVIDENCE_ROOT: ${{ github.workspace }}/_evidence/kototama
      - if: ${{ !cancelled() }}
        name: Lint CLJ launcher (clj-kondo)
        run: clojure -M:lint
      - if: ${{ !cancelled() }}
        name: Smoke CLJ launcher
        run: bin/kotoba-clj check --kind cli-contract --json
      - if: ${{ !cancelled() }}
        name: Smoke package admission gate
        run: |
          bin/kotoba-clj package verify --lock test/fixtures/package/positive-lock.edn --trust test/fixtures/package/trust.edn --json
          if bin/kotoba-clj package verify --lock test/fixtures/package/version-only-lock.edn --json; then
            echo "expected version-only lock to be rejected" >&2
            exit 1
          fi
  required-ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [native-selfhost, clj-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Require native and compatibility verification to succeed
        env:
          NATIVE_RESULT: ${{ needs.native-selfhost.result }}
          CLJ_RESULT: ${{ needs.clj-launcher.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$CLJ_RESULT" = success
