name: Native Kotoba harness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/kotoba.kotobaHarness/**'
      - '.github/workflows/native-harness.yml'
  push:
    branches: [main]
    paths:
      - 'lib/kotoba.kotobaHarness/**'
      - '.github/workflows/native-harness.yml'
permissions:
  contents: read
concurrency:
  group: native-harness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  harness:
    name: Ordered harness (native ARM64)
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm-slim
    timeout-minutes: 30
    steps:
      - name: Install transport and real browser
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 chromium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 29352f9182cba9dc0e523df3265b0965aced26f7
          path: _native/harness-amu
          persist-credentials: false
      - name: Execute selfhost-built ordered gate
        env:
          KOTOBA_BROWSER: /usr/bin/chromium
        run: |
          python3 -B lib/kotoba.kotobaHarness/bin/check-native \
            --amu "$PWD/_native/harness-amu" --output "$RUNNER_TEMP/native-harness"
      - name: Check transport refusal and source provenance
        run: python3 -B -m unittest discover -s lib/kotoba.kotobaHarness/test -p 'test_*.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-harness-arm64
          path: ${{ runner.temp }}/native-harness
