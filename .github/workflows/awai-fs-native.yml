name: Awai canonical file Native
on:
  pull_request:
    paths:
      - lib/kotoba.awaiFs/**
      - lib/kotoba.ioIpld/src/ipld/dag_cbor_write.kotoba
      - lib/kotoba.ioIpld/local-changes.json
      - lib/kotoba.ioMultiformats/src/multiformats/*.kotoba
      - scripts/native-ci-inputs.json
      - .github/workflows/awai-fs-native.yml
  push:
    branches: [main]
    paths:
      - lib/kotoba.awaiFs/**
      - lib/kotoba.ioIpld/src/ipld/dag_cbor_write.kotoba
      - lib/kotoba.ioMultiformats/src/multiformats/*.kotoba
      - scripts/native-ci-inputs.json
      - .github/workflows/awai-fs-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos:
    name: Awai format native macOS ARM64
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit owning source pins
        run: |
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.awaiFs
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.ioIpld
      - name: Fetch the existing immutable Amu Native artifacts
        run: scripts/fetch-native-amu.sh "$RUNNER_TEMP/awai-native-amu"
      - name: Execute every frozen case and built negative control on Native
        run: python3 lib/kotoba.awaiFs/test/native_gate.py --amu "$RUNNER_TEMP/awai-native-amu" --output "$RUNNER_TEMP/awai-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: awai-native-macos
          path: |
            ${{ runner.temp }}/awai-native/receipt.json
            ${{ runner.temp }}/awai-native/results.json
            ${{ runner.temp }}/awai-native/**/*.ksl
            ${{ runner.temp }}/awai-native/**/*.stdout
            ${{ runner.temp }}/awai-native/**/*.stderr
          if-no-files-found: warn
