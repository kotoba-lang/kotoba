name: Awai canonical file Native
on:
  pull_request:
    paths:
      - lib/kotoba.awaiFs/**
      - lib/kotoba.ioIpld/src/ipld/dag_cbor_write.kotoba
      - lib/kotoba.ioIpld/local-changes.json
      - lib/kotoba.ioIpldCar/**
      - lib/kotoba.ioMultiformats/**
      - lib/org.ietf.zstd/src/zstd/frame_header.kotoba
      - lib/org.ietf.zstd/test/zstd/frame_header_test.kotoba
      - scripts/native-ci-inputs.json
      - .github/workflows/awai-fs-native.yml
  push:
    branches: [main]
    paths:
      - lib/kotoba.awaiFs/**
      - lib/kotoba.ioIpld/src/ipld/dag_cbor_write.kotoba
      - lib/kotoba.ioIpldCar/**
      - lib/kotoba.ioMultiformats/**
      - lib/org.ietf.zstd/src/zstd/frame_header.kotoba
      - lib/org.ietf.zstd/test/zstd/frame_header_test.kotoba
      - scripts/native-ci-inputs.json
      - .github/workflows/awai-fs-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Awai format native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macos-arm64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: ubuntu-24.04, target: linux-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit owning source pins
        run: |
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.awaiFs
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.ioIpld
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.ioMultiformats
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.ioIpldCar
      - name: Fetch the existing immutable Amu Native artifacts
        run: |
          scripts/fetch-native-amu.sh "$RUNNER_TEMP/awai-native-amu"
          git -C "$RUNNER_TEMP/awai-native-amu" sparse-checkout add /seed/x86_64-kx64-runner.kotoba
      - name: Fetch the separately pinned x86 file I/O compiler
        if: matrix.target == 'linux-x86_64'
        run: |
          git init "$RUNNER_TEMP/awai-x86-io"
          git -C "$RUNNER_TEMP/awai-x86-io" remote add origin https://github.com/kotoba-lang/amu.git
          git -C "$RUNNER_TEMP/awai-x86-io" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/awai-x86-io" sparse-checkout set --no-cone /bin/amu-linux-x86_64
          git -C "$RUNNER_TEMP/awai-x86-io" fetch --depth=1 origin f5f962163e30aaf31c68c677fce46b9a44f715dd
          git -C "$RUNNER_TEMP/awai-x86-io" checkout --detach FETCH_HEAD
      - name: Native cooperative Forest commit and export
        if: matrix.target == 'linux-arm64'
        run: sh lib/kotoba.awaiFs/test/native_forest_export_linux_gate.sh "$RUNNER_TEMP/awai-native-amu" "$RUNNER_TEMP/awai-export-gate"
      - name: Execute every frozen case and built negative control on Native
        run: python3 lib/kotoba.awaiFs/test/native_gate.py --amu "$RUNNER_TEMP/awai-native-amu" --x86-io-amu "$RUNNER_TEMP/awai-x86-io" --target "${{ matrix.target }}" --output "$RUNNER_TEMP/awai-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: awai-native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/awai-native/receipt.json
            ${{ runner.temp }}/awai-native/results.json
            ${{ runner.temp }}/awai-native/**/*.ksl
            ${{ runner.temp }}/awai-native/**/*.stdout
            ${{ runner.temp }}/awai-native/**/*.stderr
            ${{ runner.temp }}/awai-export-gate/*.ksl
            ${{ runner.temp }}/awai-export-gate/*.stdout
            ${{ runner.temp }}/awai-export-gate/*.stderr
          if-no-files-found: warn
