name: experimental-amu-cross-repository-cache-preview
# Diagnostic only. This branch-scoped fixture expires and never replaces CI gates.
on:
  pull_request:
    paths:
      - "scripts/diagnose-amu-cache-preview.py"
      - ".github/workflows/amu-cache-cross-repo-preview.yml"
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 951037128374dcf97d26d5f5e6699131076dba10
          path: _native/amu
          persist-credentials: false
      - name: Stage pinned provenance verifier
        run: |
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 120 --max-filesize 33554432 --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/gh.tar.gz" https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
          python3 _native/amu/scripts/seed/stage_pinned_gh.py --archive "$RUNNER_TEMP/gh.tar.gz" --output "$RUNNER_TEMP/pinned-gh"
      - name: Read, verify and freshly execute the fixed cross-repository fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/diagnose-amu-cache-preview.py --amu "$PWD/_native/amu"
          --gh "$RUNNER_TEMP/pinned-gh" --output "$RUNNER_TEMP/cross-cache"
