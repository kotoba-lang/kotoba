name: Native shared text
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-shared:
    name: Native text (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: arm64
          - runner: ubuntu-latest
            target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 6a77cd91182b858fff435c679e8ef71f514fc2ae
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/browser
          ref: 6e3ca4e768d886060abe7bff70da07cf36f5dabc
          path: _shared/browser
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/dom-gpu
          ref: c0be10ca6b0089e5fbe061eb76a6c23e61f61b22
          path: _shared/dom
          persist-credentials: false
      - name: Verify the exact native compiler image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('_native/amu')
          arm = os.environ['TARGET'] == 'arm64'
          image = root / ('seed/bootstrap/aarch64-linux-static-root.elf' if arm else 'bin/amu')
          meta = json.loads((root / ('seed/bootstrap/aarch64-linux-static-root.json' if arm else 'native-product.json')).read_text())
          assert hashlib.sha256(image.read_bytes()).hexdigest() == meta['image']['sha256']
          PY
      - name: Execute native x86 project and refusal controls
        if: matrix.target == 'x86_64'
        run: python3 _native/amu/scripts/seed/check-x86-project-native.py --compiler "$PWD/_native/amu/bin/amu" --output "$RUNNER_TEMP/project-native"
      - name: Execute current owner source on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/_shared/browser/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD/_shared/browser" --dom "$PWD/_shared/dom" --text "$PWD/lib/kotoba.text" --case text --output "$RUNNER_TEMP/owner-native"
      - name: Execute current owner source on x86
        if: matrix.target == 'x86_64'
        run: python3 "$PWD/_shared/browser/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD/_shared/browser" --dom "$PWD/_shared/dom" --text "$PWD/lib/kotoba.text" --case text --output "$RUNNER_TEMP/owner-native"
      - name: Execute accountable admission and budget-bypass refusal on x86
        if: matrix.target == 'x86_64'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/native-product.json"))["image"]["sha256"])')
          python3 lib/kotoba.hata/scripts/check-admission-native.py \
            --compiler "$PWD/_native/amu/bin/amu" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/admission-native"
      - name: Execute C0 signatures, responsibility credentials and signature-bypass refusal on x86
        if: matrix.target == 'x86_64'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/native-product.json"))["image"]["sha256"])')
          python3 lib/kotoba.hata/scripts/check-authority-native.py \
            --compiler "$PWD/_native/amu/bin/amu" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/authority-native" \
            --case authority
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.target == 'x86_64'
        with:
          repository: kotoba-lang/amu
          ref: a530b2262f0d4d138081d9f48bd3b59e0eb51e74
          path: _native/awai-project-candidate
          persist-credentials: false
      - name: Derive and qualify the explicit experimental FS35/CLI38 compiler
        if: matrix.target == 'x86_64'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/awai-project-candidate/native-product.json"))["image"]["sha256"])')
          python3 _native/awai-project-candidate/scripts/seed/check-x86-project-fs-native.py \
            --compiler "$PWD/_native/awai-project-candidate/bin/amu" --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/awai-project-candidate" --derive
      - name: Execute signed durable admission, races and process-crash boundaries on x86
        if: matrix.target == 'x86_64'
        run: |
          compiler_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compilerSHA256"])' "$RUNNER_TEMP/awai-project-candidate/evidence.json")
          python3 lib/kotoba.hata/scripts/check-authority-native.py \
            --compiler "$RUNNER_TEMP/awai-project-candidate/candidate-F3.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/awai-project-candidate/candidate-runner.elf" \
            --output "$RUNNER_TEMP/authority-store-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/owner-native/*.json
            ${{ runner.temp }}/owner-native/*.ksl
            ${{ runner.temp }}/owner-native/*.stdout
            ${{ runner.temp }}/owner-native/*.stderr
            ${{ runner.temp }}/project-native/*.json
            ${{ runner.temp }}/project-native/*.stdout
            ${{ runner.temp }}/project-native/*.stderr
            ${{ runner.temp }}/admission-native/*.json
            ${{ runner.temp }}/admission-native/*.ksl
            ${{ runner.temp }}/admission-native/*.stdout
            ${{ runner.temp }}/admission-native/*.stderr
            ${{ runner.temp }}/authority-native/*.json
            ${{ runner.temp }}/authority-native/*.ksl
            ${{ runner.temp }}/authority-native/*.stdout
            ${{ runner.temp }}/authority-native/*.stderr
            ${{ runner.temp }}/awai-project-candidate/*.json
            ${{ runner.temp }}/awai-project-candidate/*.ksl
            ${{ runner.temp }}/awai-project-candidate/*.stdout
            ${{ runner.temp }}/awai-project-candidate/*.stderr
            ${{ runner.temp }}/authority-store-native/*.json
            ${{ runner.temp }}/authority-store-native/*.ksl
            ${{ runner.temp }}/authority-store-native/*.stdout
            ${{ runner.temp }}/authority-store-native/*.stderr
          if-no-files-found: warn
