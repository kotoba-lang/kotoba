name: Native shared text
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  # The x86 store / broker / history lanes run on main and nightly, not on PRs (JUN-629).
  schedule:
    - cron: '23 18 * * *'
permissions:
  contents: read
concurrency:
  group: native-shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-shared:
    name: Native text (${{ matrix.target }}${{ matrix.lane && format(' / {0}', matrix.lane) || '' }})
    runs-on: ${{ matrix.runner }}
    # The x86 broker lane has taken 20-60+ minutes depending on the runner (it was cut
    # at 60 while on its last control, kotoba#1020); 90 leaves room on a slow runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The x86_64 gate is sharded into independent lanes that run in parallel; each lane re-runs the shared
      # prelude (checkout, compiler verification, project runner). CI tiers (JUN-629, owner decision 2026-10-30):
      # a pull request runs arm64, x86 base and x86 authority-f3 (a real x86 hata case on the candidate compiler),
      # and the hata-macos job below runs the full broker and history sections natively. The x86 store, broker and
      # history lanes take 9-60 minutes because x86 user code is 70-150x slower than arm64 for the same gate
      # (x86 codegen, not the scenarios), so they run on every push to main and nightly instead, unchanged.
      # The x86 pq-unity lane (ML-KEM-768, ML-DSA-65 and the print-free SHA-3 gate, with their mutants, AWAI-117) is in that tier too.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"runner":"ubuntu-24.04-arm","target":"arm64"},{"runner":"ubuntu-latest","target":"x86_64","lane":"base"},{"runner":"ubuntu-latest","target":"x86_64","lane":"authority-f3"}]' || '[{"runner":"ubuntu-24.04-arm","target":"arm64"},{"runner":"ubuntu-latest","target":"x86_64","lane":"base"},{"runner":"ubuntu-latest","target":"x86_64","lane":"authority-f3"},{"runner":"ubuntu-latest","target":"x86_64","lane":"store"},{"runner":"ubuntu-latest","target":"x86_64","lane":"broker"},{"runner":"ubuntu-latest","target":"x86_64","lane":"history"},{"runner":"ubuntu-latest","target":"x86_64","lane":"pq-unity"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit AIUEOS library source pins (source preflight only)
        run: python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.aiueos
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 6a77cd91182b858fff435c679e8ef71f514fc2ae
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/browser
          ref: 6e3ca4e768d886060abe7bff70da07cf36f5dabc
          path: _shared/browser
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/dom-gpu
          ref: c0be10ca6b0089e5fbe061eb76a6c23e61f61b22
          path: _shared/dom
          persist-credentials: false
      - name: Verify the exact native compiler image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('_native/amu')
          arm = os.environ['TARGET'] == 'arm64'
          image = root / ('seed/bootstrap/aarch64-linux-static-root.elf' if arm else 'bin/amu')
          meta = json.loads((root / ('seed/bootstrap/aarch64-linux-static-root.json' if arm else 'native-product.json')).read_text())
          assert hashlib.sha256(image.read_bytes()).hexdigest() == meta['image']['sha256']
          PY
      - name: Execute native x86 project and refusal controls
        if: matrix.target == 'x86_64'
        run: python3 _native/amu/scripts/seed/check-x86-project-native.py --compiler "$PWD/_native/amu/bin/amu" --output "$RUNNER_TEMP/project-native"
      - name: Execute current owner source on ARM
        if: matrix.target == 'arm64'
        run: python3 "$PWD/_shared/browser/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" --browser "$PWD/_shared/browser" --dom "$PWD/_shared/dom" --text "$PWD/lib/kotoba.text" --case text --output "$RUNNER_TEMP/owner-native"
      - name: Execute post-quantum and secure-channel known answers and mutants on ARM
        # x86 runs the module gates on PRs (base lane) and ML-KEM / ML-DSA / print-free SHA-3 on main and nightly (pq-unity lane).
        # This lane runs the printing SHA-3 gate (sha3) as committed and compares its 126 oracle lines with Python hashlib.
        if: matrix.target == 'arm64'
        run: |
          for lib in gov.nist.sha3 gov.nist.mlKem gov.nist.mlDsa org.ietf.x25519 org.ietf.chacha20Poly1305 kotoba.pqh gov.nist.aes org.ietf.xwing kotoba.noise; do
            python3 scripts/check-library-local-changes-pins.py --root "lib/$lib"
          done
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/seed/bootstrap/aarch64-linux-static-root.json"))["image"]["sha256"])')
          python3 scripts/check-pq-native.py \
            --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" \
            --output "$RUNNER_TEMP/pq-native"
      - name: Execute the Wycheproof X25519 and (X)ChaCha20-Poly1305 vectors and mutants on ARM (AWAI-117)
        if: matrix.target == 'arm64'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/seed/bootstrap/aarch64-linux-static-root.json"))["image"]["sha256"])')
          python3 scripts/check-wycheproof-native.py \
            --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" \
            --output "$RUNNER_TEMP/wycheproof-native"
      - name: Execute every committed ACVP ML-KEM-768 test and mutants on ARM (AWAI-117)
        if: matrix.target == 'arm64'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/seed/bootstrap/aarch64-linux-static-root.json"))["image"]["sha256"])')
          python3 scripts/check-acvp-mlkem-native.py \
            --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba" \
            --output "$RUNNER_TEMP/acvp-mlkem-native"
      - name: Execute the secure-channel module gates and mutants on x86 (AWAI-117)
        # The module gates only. The unity gates are slow on x86 and run in the pq-unity lane;
        # see scripts/check-pq-native.py for why x86 runs the print-free SHA-3 gate (sha3-x86).
        if: matrix.target == 'x86_64' && matrix.lane == 'base'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/native-product.json"))["image"]["sha256"])')
          python3 scripts/check-pq-native.py --module-gates-only \
            --compiler "$PWD/_native/amu/bin/amu" --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/pq-native-x86"
      - name: Execute ML-KEM-768, ML-DSA-65 and print-free SHA-3 known answers and mutants on x86 (AWAI-117)
        # KX64 admits the gates' hex string vectors. The SHA-3 gate prints through :io/write, which the
        # locked x86 project adapter refuses (E7101 OP-CAP), so x86 runs sha3-x86: the same gate with its
        # print rewritten away at build time, answering by its result value only, with both SHA-3 mutants.
        if: matrix.target == 'x86_64' && matrix.lane == 'pq-unity'
        run: |
          for lib in gov.nist.sha3 gov.nist.mlKem gov.nist.mlDsa; do
            python3 scripts/check-library-local-changes-pins.py --root "lib/$lib"
          done
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/native-product.json"))["image"]["sha256"])')
          python3 scripts/check-pq-native.py --gates mlkem,mldsa,sha3-x86 \
            --compiler "$PWD/_native/amu/bin/amu" --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/pq-native-x86"
      # The sessions run on a newer amu than the rest of this workflow: the broker driver
      # built by the 6a77cd9 compiler traps (SIGILL) in prepare on aarch64-linux, and
      # 65359a0's compiler (image 8ebb44c5) runs every mode. Drop this checkout once the
      # _native/amu pin moves past it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.target == 'arm64'
        with:
          repository: kotoba-lang/amu
          ref: 65359a092b6c552b5adf436a0c359bc91d1676d3
          path: _native/amu-session
          persist-credentials: false
      - name: Execute broker votes over authenticated native sessions on ARM
        if: matrix.target == 'arm64'
        run: |
          python3 lib/kotoba.hata/scripts/check-session-native.py \
            --compiler "$PWD/_native/amu-session/seed/bootstrap/aarch64-linux-static-root.elf" \
            --compiler-sha256 8ebb44c5d6babf3a02ef7d1785291b9741f1f7c410a9ee8dce9185c95d6bd34d \
            --runner-source "$PWD/_native/amu-session/seed/x86_64-kx64-runner.kotoba" \
            --output "$RUNNER_TEMP/broker-session-native"
      - name: Execute current owner source on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'base'
        run: python3 "$PWD/_shared/browser/scripts/check-shared-native.py" --compiler "$PWD/_native/amu/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/project-native/runner.elf" --browser "$PWD/_shared/browser" --dom "$PWD/_shared/dom" --text "$PWD/lib/kotoba.text" --case text --output "$RUNNER_TEMP/owner-native"
      - name: Execute accountable admission and budget-bypass refusal on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'base'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/native-product.json"))["image"]["sha256"])')
          python3 lib/kotoba.hata/scripts/check-admission-native.py \
            --compiler "$PWD/_native/amu/bin/amu" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/admission-native"
      - name: Execute C0 signatures, responsibility credentials and signature-bypass refusal on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'base'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/amu/native-product.json"))["image"]["sha256"])')
          python3 lib/kotoba.hata/scripts/check-authority-native.py \
            --compiler "$PWD/_native/amu/bin/amu" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/authority-native" \
            --case authority
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.target == 'x86_64' && matrix.lane != 'base' && matrix.lane != 'pq-unity'
        with:
          repository: kotoba-lang/amu
          ref: a530b2262f0d4d138081d9f48bd3b59e0eb51e74
          path: _native/awai-project-candidate
          persist-credentials: false
      - name: Derive and qualify the explicit experimental FS35/CLI38 compiler
        if: matrix.target == 'x86_64' && matrix.lane != 'base' && matrix.lane != 'pq-unity'
        run: |
          compiler_sha=$(python3 -c 'import json; print(json.load(open("_native/awai-project-candidate/native-product.json"))["image"]["sha256"])')
          python3 _native/awai-project-candidate/scripts/seed/check-x86-project-fs-native.py \
            --compiler "$PWD/_native/awai-project-candidate/bin/amu" --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/project-native/runner.elf" \
            --output "$RUNNER_TEMP/awai-project-candidate" --derive
      - name: Execute signed durable admission authority case on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'authority-f3'
        run: |
          compiler_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compilerSHA256"])' "$RUNNER_TEMP/awai-project-candidate/evidence.json")
          python3 lib/kotoba.hata/scripts/check-authority-native.py \
            --compiler "$RUNNER_TEMP/awai-project-candidate/candidate-F3.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/awai-project-candidate/candidate-runner.elf" \
            --output "$RUNNER_TEMP/authority-store-native" \
            --case authority
      - name: Execute durable store, races and process-crash boundaries on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'store'
        run: |
          compiler_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compilerSHA256"])' "$RUNNER_TEMP/awai-project-candidate/evidence.json")
          python3 lib/kotoba.hata/scripts/check-authority-native.py \
            --compiler "$RUNNER_TEMP/awai-project-candidate/candidate-F3.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/awai-project-candidate/candidate-runner.elf" \
            --output "$RUNNER_TEMP/authority-store-native" \
            --case store
      - name: Execute fixed-roster quorum and managed-object broker on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'broker'
        run: |
          compiler_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compilerSHA256"])' "$RUNNER_TEMP/awai-project-candidate/evidence.json")
          python3 lib/kotoba.hata/scripts/check-broker-native.py \
            --compiler "$RUNNER_TEMP/awai-project-candidate/candidate-F3.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/awai-project-candidate/candidate-runner.elf" \
            --output "$RUNNER_TEMP/broker-quorum-native" \
            --section broker
      - name: Execute quorum audit-history and fresh-read verdicts on x86
        if: matrix.target == 'x86_64' && matrix.lane == 'history'
        run: |
          compiler_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["compilerSHA256"])' "$RUNNER_TEMP/awai-project-candidate/evidence.json")
          python3 lib/kotoba.hata/scripts/check-broker-native.py \
            --compiler "$RUNNER_TEMP/awai-project-candidate/candidate-F3.elf" \
            --compiler-sha256 "$compiler_sha" \
            --runner "$RUNNER_TEMP/awai-project-candidate/candidate-runner.elf" \
            --output "$RUNNER_TEMP/broker-history-native" \
            --section history
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-native-${{ matrix.target }}${{ matrix.lane && format('-{0}', matrix.lane) || '' }}
          path: |
            ${{ runner.temp }}/owner-native/*.json
            ${{ runner.temp }}/owner-native/*.ksl
            ${{ runner.temp }}/owner-native/*.stdout
            ${{ runner.temp }}/owner-native/*.stderr
            ${{ runner.temp }}/project-native/*.json
            ${{ runner.temp }}/project-native/*.stdout
            ${{ runner.temp }}/project-native/*.stderr
            ${{ runner.temp }}/admission-native/*.json
            ${{ runner.temp }}/admission-native/*.ksl
            ${{ runner.temp }}/admission-native/*.stdout
            ${{ runner.temp }}/admission-native/*.stderr
            ${{ runner.temp }}/authority-native/*.json
            ${{ runner.temp }}/authority-native/*.ksl
            ${{ runner.temp }}/authority-native/*.stdout
            ${{ runner.temp }}/authority-native/*.stderr
            ${{ runner.temp }}/awai-project-candidate/*.json
            ${{ runner.temp }}/awai-project-candidate/*.ksl
            ${{ runner.temp }}/awai-project-candidate/*.stdout
            ${{ runner.temp }}/awai-project-candidate/*.stderr
            ${{ runner.temp }}/*/evidence.json
            ${{ runner.temp }}/authority-store-native/*.json
            ${{ runner.temp }}/authority-store-native/*.ksl
            ${{ runner.temp }}/authority-store-native/*.stdout
            ${{ runner.temp }}/authority-store-native/*.stderr
            ${{ runner.temp }}/broker-quorum-native/*.json
            ${{ runner.temp }}/broker-quorum-native/*.ksl
            ${{ runner.temp }}/broker-quorum-native/*.stdout
            ${{ runner.temp }}/broker-quorum-native/*.stderr
            ${{ runner.temp }}/pq-native/*.json
            ${{ runner.temp }}/pq-native/*.ksl
            ${{ runner.temp }}/pq-native/*.stdout
            ${{ runner.temp }}/pq-native/*.stderr
            ${{ runner.temp }}/pq-native-x86/*.stdout
            ${{ runner.temp }}/pq-native-x86/*.stderr
            ${{ runner.temp }}/broker-history-native/*.json
            ${{ runner.temp }}/broker-history-native/*.ksl
            ${{ runner.temp }}/broker-history-native/*.stdout
            ${{ runner.temp }}/broker-history-native/*.stderr
            ${{ runner.temp }}/broker-session-native/*.json
            ${{ runner.temp }}/broker-session-native/*.ksl
            ${{ runner.temp }}/broker-session-native/*.stdout
            ${{ runner.temp }}/broker-session-native/*.stderr
          if-no-files-found: warn
  hata-macos:
    # The full hata broker and history sections on the Mac route (JUN-593): native aarch64 code, about half a minute
    # each where the x86 lanes take 20-60 (JUN-629). Runs on every event, PRs included.
    name: Native text (macos-arm64 / hata broker + history)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 65359a092b6c552b5adf436a0c359bc91d1676d3
          path: _native/amu-mac
          persist-credentials: false
      - name: Verify the exact Mac root compiler and packager
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_native/amu-mac/seed/bootstrap/aarch64-macos')
          meta = json.loads((root / 'root.json').read_text())
          for name, key in (('amu-full-root.macho', 'compiler'), ('kotoba-packager-root.macho', 'packager')):
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == meta[key]['sha256'], name
          PY
      - name: Execute fixed-roster quorum and managed-object broker on macOS arm64
        run: |
          r=_native/amu-mac/seed/bootstrap/aarch64-macos
          python3 lib/kotoba.hata/scripts/check-broker-native.py \
            --compiler "$r/amu-full-root.macho" --compiler-sha256 "$(shasum -a 256 "$r/amu-full-root.macho" | cut -c1-64)" \
            --packager "$r/kotoba-packager-root.macho" --packager-sha256 "$(shasum -a 256 "$r/kotoba-packager-root.macho" | cut -c1-64)" \
            --output "$RUNNER_TEMP/broker-quorum-native" --section broker
      - name: Execute quorum audit-history and fresh-read verdicts on macOS arm64
        run: |
          r=_native/amu-mac/seed/bootstrap/aarch64-macos
          python3 lib/kotoba.hata/scripts/check-broker-native.py \
            --compiler "$r/amu-full-root.macho" --compiler-sha256 "$(shasum -a 256 "$r/amu-full-root.macho" | cut -c1-64)" \
            --packager "$r/kotoba-packager-root.macho" --packager-sha256 "$(shasum -a 256 "$r/kotoba-packager-root.macho" | cut -c1-64)" \
            --output "$RUNNER_TEMP/broker-history-native" --section history
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hata-macos
          path: |
            ${{ runner.temp }}/*/evidence.json
            ${{ runner.temp }}/*/*.stdout
            ${{ runner.temp }}/*/*.stderr
          if-no-files-found: ignore
