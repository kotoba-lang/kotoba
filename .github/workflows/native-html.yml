name: Native HTML fixtures
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-html-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-html:
    name: Native HTML fixtures (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: d4d6841f129d846db13393a469645e1ca91fb568
          path: _native/amu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Unmerged draft dependency: kotoba PR #1173.
          repository: kotoba-lang/kotoba
          ref: 071a7a524f9c416815937fed0a3443285c2ff7e0
          path: _deps/dom
          persist-credentials: false
      - name: Verify retained HTML source data
        run: |
          python3 scripts/check-library-local-changes-pins.py --root lib/kotoba.htmldom
          python3 lib/kotoba.htmldom/scripts/generate_html_entities.py --check
      - name: Run native HTML fixtures and refusal controls
        run: >-
          python3 scripts/check-html-native.py
          --compiler "$PWD/_native/amu/seed/bootstrap/aarch64-linux-static-root.elf"
          --compiler-sha256 73350746c1f86dcfbe8cf47723bd7bb1e33ee28f0e08e40bef2dd2b196f5a09b
          --runner-source "$PWD/_native/amu/seed/x86_64-kx64-runner.kotoba"
          --dom "$PWD/_deps/dom/lib/kotoba.domGpu"
          --output "$RUNNER_TEMP/html-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-html-arm64
          path: |
            ${{ runner.temp }}/html-native/*.json
            ${{ runner.temp }}/html-native/*.ksl
            ${{ runner.temp }}/html-native/*.stdout
            ${{ runner.temp }}/html-native/*.stderr
          if-no-files-found: warn
