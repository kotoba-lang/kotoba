<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>折本 — アプリをひらく</title>
<style>
:root{--cream:#f5efdf;--ink:#243b3a;--muted:#6e7970;--red:#b96f55;--gold:#d5b881}*{box-sizing:border-box}body{margin:0;background:#1e3133;color:#f6f0e3;font-family:ui-serif,"Hiragino Mincho ProN","Yu Mincho",serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #e99370;outline-offset:4px}header{height:68px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20}header strong{font-weight:400;letter-spacing:.22em;font-size:18px}header small,.eyebrow{font:10px ui-sans-serif,system-ui;letter-spacing:.17em;color:#aebbb0}.settings{display:flex;gap:10px}.quiet{font:12px ui-sans-serif,system-ui;color:#eee8d8;background:transparent;border:1px solid #ffffff44;padding:10px 13px;border-radius:3px}.quiet[aria-pressed=true]{background:#ede3ca;color:#253b38}main{max-width:1550px;margin:auto;padding:clamp(32px,5vw,72px) 4vw}.top{display:flex;justify-content:space-between;align-items:end;gap:30px;margin:0 auto 34px;max-width:1340px}.top h1{font-size:clamp(30px,3.2vw,46px);font-weight:400;letter-spacing:.1em;margin:13px 0}.top p{font:13px/1.9 ui-sans-serif,system-ui;color:#c1c9bc;margin:0;max-width:530px}.number{font:11px ui-sans-serif,system-ui;color:#d0b688;white-space:nowrap}.table{background:radial-gradient(ellipse at 52% 34%,#3b5754,#283d3d 55%,#1b2d2f);border:1px solid #ffffff12;box-shadow:inset 0 0 110px #08171666;min-height:520px;padding:65px 25px 38px;overflow:auto}.shelf{display:flex;align-items:stretch;justify-content:center;gap:16px;min-width:max-content;margin:auto}.book{display:flex;align-items:stretch;height:390px;filter:drop-shadow(0 17px 15px #09181780);--binding:#8a694f;--edge:#c5a77a}.cover{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:148px;height:390px;border:1px solid var(--edge);border-radius:3px 2px 2px 3px;padding:24px 15px 18px;color:#f8f0dd;background:repeating-linear-gradient(135deg,var(--binding) 0,var(--binding) 2px,color-mix(in srgb,var(--binding),white 9%) 3px,color-mix(in srgb,var(--binding),white 9%) 6px);transition:transform .32s ease,box-shadow .32s ease}.cover:hover{transform:translateY(-7px);box-shadow:0 16px 18px #14252455}.book.open .cover{width:100px;border-radius:3px 0 0 3px}.cover .topline{font:10px ui-sans-serif,system-ui;letter-spacing:.17em;opacity:.8}.cover-label{background:#f3ead6;color:#273a36;border:1px solid #dfcdae;padding:14px 11px;min-height:172px;writing-mode:vertical-rl;letter-spacing:.25em;font-size:20px;box-shadow:0 1px 4px #2a211d44}.book.open .cover-label{font-size:16px}.cover-foot{font:11px ui-sans-serif,system-ui;line-height:1.5;opacity:.85}.ticks{position:absolute;right:3px;top:20%;height:60%;display:flex;flex-direction:column;justify-content:space-around}.ticks i{width:7px;height:2px;background:#f5ebd2bb}.pages{display:none;position:relative;align-items:stretch;perspective:900px}.book.open .pages{display:flex}.page{width:43px;position:relative;color:var(--ink);background:linear-gradient(90deg,#e2d7c4,#f7f2e8 30%,#e8dece);border-right:1px solid #c8bba3;transition:width .35s cubic-bezier(.2,.8,.2,1);display:flex;overflow:hidden}.page:nth-child(even){background:linear-gradient(90deg,#d7cbb7,#f4eee2 32%,#e5dac8)}.page.selected{width:285px;background:linear-gradient(90deg,#ece2d1,#f9f6ee 12%,#f5efe2 94%,#e2d7c4);box-shadow:0 12px 20px #10231f33;z-index:2}.tab{width:43px;min-width:43px;min-height:100%;border:0;border-right:1px solid #c9bca7;background:transparent;color:#58706a;writing-mode:vertical-rl;letter-spacing:.14em;font-size:12px;padding:15px 10px;text-align:left}.page.selected .tab{background:#e4d4bb;color:#884f3c}.page-content{width:242px;min-width:242px;padding:26px 23px 20px;display:none;flex-direction:column}.page.selected .page-content{display:flex}.page-content small{font:10px ui-sans-serif,system-ui;letter-spacing:.15em;color:#889087}.page-content h2{font-weight:400;font-size:22px;letter-spacing:.09em;margin:17px 0 8px}.page-content p{font:12px/1.95 ui-sans-serif,system-ui;color:#5b6d65}.rule{height:1px;background:#d8cdb9;margin:11px 0 12px}.item{padding:11px 0;border-bottom:1px solid #dbd2c2;font:12px/1.6 ui-sans-serif,system-ui}.item strong{display:block;color:#304a43}.item span{font-size:11px;color:#879086}.page-foot{margin-top:auto;font:10px ui-sans-serif,system-ui;color:#93998a}.close{position:absolute;right:10px;top:9px;z-index:5;border:0;background:transparent;color:#687a6e;font:11px ui-sans-serif,system-ui;padding:6px}.book[data-app=itonami]{--binding:#a47051;--edge:#d2a779}.book[data-app=murakumo]{--binding:#64726b;--edge:#a7b2a0}.book[data-app=yataverse]{--binding:#665c76;--edge:#b8a9bd}.book[data-app=aozora]{--binding:#79999d;--edge:#b3ccc4}.bottom{display:flex;justify-content:space-between;gap:20px;max-width:1340px;margin:25px auto 0}.legend{display:flex;gap:24px;flex-wrap:wrap;font:12px/1.9 ui-sans-serif,system-ui;color:#c6cec1}.legend b{color:#e1c998;font-weight:500;margin-right:7px}.hint{font:11px/1.8 ui-sans-serif,system-ui;color:#a6b8ad;text-align:right}.notice{max-width:1340px;margin:30px auto 0;border-top:1px solid #ffffff20;padding-top:16px;color:#a5b7ab;font:11px/1.8 ui-sans-serif,system-ui}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.reduce *{transition:none!important}@media(max-width:800px){header{padding:0 18px}.top{display:block}.number{display:none}.table{padding:40px 16px;min-height:480px}.shelf{justify-content:flex-start;gap:12px}.book,.cover{height:365px}.cover{width:124px}.book.open .cover{width:78px}.cover-label{font-size:17px}.page.selected{width:255px}.page-content{width:212px;min-width:212px;padding:23px 16px}.bottom{flex-direction:column}.hint{text-align:left}main{padding:32px 14px}.legend{gap:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header><strong>折本 <small>ORIHON / CONCEPT</small></strong><div class="settings"><button class="quiet" id="motion" aria-pressed="false">動きを抑える</button><button class="quiet" id="close-all">すべて閉じる</button></div></header><main><div class="top"><div><div class="eyebrow">Your apps, each with a cover</div><h1>好きなところから、ひらく。</h1><p>アプリは、それぞれ一冊の折本。表紙の触れた位置から、そのアプリだけをひらきます。</p></div><div class="number">四冊のアプリ　／　手元の本棚</div></div><section class="table" aria-label="アプリの折本" id="table"><div class="shelf" id="shelf"></div></section><div class="bottom"><div class="legend"><span><b>01</b>表紙の上・中・下をタップ</span><span><b>02</b>折り目をタップして頁を移動</span><span><b>03</b>閉じてもほかの本はそのまま</span></div><div class="hint">本棚は横にスクロールできます<br>Tab・Enter・← → キーでも操作</div></div><p class="notice">独立した操作試作です。内容はサンプルで、実際のアプリ起動や通信は行いません。表紙を閉じることはロックではありません。</p><div id="announce" class="sr" aria-live="polite"></div></main>
<script>
(()=>{'use strict';const definitions=[{id:'itonami',name:'いとなみ',en:'ITONAMI',pages:[{title:'いま、ここ',sub:'今日のいとなみ',items:[['今日の予定','日々のことを整える'],['続きから','庭の計画']]},{title:'つくる',sub:'思いつきを育てる',items:[['庭の計画','昨日のつづき'],['メモ','3つの下書き']]},{title:'つながり',sub:'身近な人や場所',items:[['家族','最近のやりとり'],['地域','保存した知らせ']]},{title:'ふりかえり',sub:'これまでの足あと',items:[['きょう','メモを開いた'],['きのう','計画をはじめた']]}]},{id:'murakumo',name:'むらくも',en:'MURAKUMO',pages:[{title:'ひろば',sub:'つながりの入口',items:[['最近の動き','手元の概要'],['お気に入り','よく使う場所']]},{title:'さがす',sub:'必要なものを探す',items:[['ことばから','探したいことを入力'],['保存したもの','あとで読む']]},{title:'ノード',sub:'選んだ接続の状態',items:[['この端末','手元'],['接続先','確認してから接続']]},{title:'記録',sub:'自分の履歴',items:[['きょう','開いた頁'],['以前','保存した項目']]}]},{id:'yataverse',name:'やたばーす',en:'YATAVERSE',pages:[{title:'ひろば',sub:'世界の入口',items:[['気になる場所','保存済みの世界'],['つづきから','前回の場所']]},{title:'世界',sub:'見つける',items:[['季節の庭','世界のサンプル'],['小さな島','世界のサンプル']]},{title:'なかま',sub:'一緒に過ごす',items:[['友だち','参加状況'],['招待','あとで確認']]},{title:'もちもの',sub:'手元のコレクション',items:[['お気に入り','大切にしているもの'],['最近','新しく見つけたもの']]}]},{id:'aozora',name:'あおぞら',en:'AOZORA',pages:[{title:'本棚',sub:'読むものを選ぶ',items:[['最近読んだ本','つづきから'],['あとで読む','保存した頁']]},{title:'読む',sub:'静かにひらく',items:[['しおり','前回の位置'],['文字の大きさ','読みやすく整える']]},{title:'ことば',sub:'心に残したもの',items:[['書き留めた一節','自分のノート'],['お気に入り','あとで見返す']]},{title:'履歴',sub:'読んだ道のり',items:[['きょう','ひらいた本'],['今週','読んだ頁']]}]}];const shelf=document.querySelector('#shelf'),live=document.querySelector('#announce');let reduced=false;function announce(text){live.textContent=text}function setPage(book,n,focus=false){const pages=[...book.querySelectorAll('.page')],app=definitions.find(x=>x.id===book.dataset.app);n=Math.max(0,Math.min(pages.length-1,n));book.dataset.page=String(n);pages.forEach((p,i)=>{p.classList.toggle('selected',i===n);const btn=p.querySelector('.tab');btn.setAttribute('aria-selected',String(i===n));btn.tabIndex=i===n?0:-1;p.querySelector('.page-content').hidden=i!==n});if(focus)pages[n].querySelector('.tab').focus();announce(app.name+'の「'+app.pages[n].title+'」を開きました')}function open(book,n){const cover=book.querySelector('.cover');book.classList.add('open');cover.setAttribute('aria-expanded','true');book.querySelector('.pages').hidden=false;setPage(book,n);if(matchMedia('(max-width:800px)').matches)book.scrollIntoView({behavior:(reduced||matchMedia('(prefers-reduced-motion: reduce)').matches)?'instant':'smooth',block:'nearest',inline:'center'})}function close(book,focus=false){book.classList.remove('open');const cover=book.querySelector('.cover');cover.setAttribute('aria-expanded','false');book.querySelector('.pages').hidden=true;if(focus)cover.focus();announce(definitions.find(x=>x.id===book.dataset.app).name+'の表紙を閉じました')}definitions.forEach(app=>{const book=document.createElement('article');book.className='book';book.dataset.app=app.id;book.dataset.page='0';const cover=document.createElement('button');cover.className='cover';cover.type='button';cover.setAttribute('aria-expanded','false');cover.setAttribute('aria-controls','pages-'+app.id);cover.setAttribute('aria-label',app.name+'を開く。表紙の上から下の位置で開く頁を選べます');cover.innerHTML='<span class="topline">'+app.en+'</span><span class="cover-label">'+app.name+'</span><span class="cover-foot">触れたところから<br>ひらく</span><span class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';const pages=document.createElement('div');pages.className='pages';pages.id='pages-'+app.id;pages.hidden=true;const closeButton=document.createElement('button');closeButton.type='button';closeButton.className='close';closeButton.textContent='閉じる ×';closeButton.setAttribute('aria-label',app.name+'を閉じる');closeButton.addEventListener('click',()=>close(book,true));pages.append(closeButton);const tablist=document.createElement('div');tablist.setAttribute('role','tablist');tablist.setAttribute('aria-label',app.name+'の頁');tablist.style.display='flex';app.pages.forEach((data,i)=>{const page=document.createElement('section');page.className='page';const tab=document.createElement('button');tab.type='button';tab.className='tab';tab.setAttribute('role','tab');tab.id='tab-'+app.id+'-'+i;tab.setAttribute('aria-controls','panel-'+app.id+'-'+i);tab.textContent=String(i+1).padStart(2,'0')+' '+data.title;tab.addEventListener('click',()=>setPage(book,i));tab.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();setPage(book,(i+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:3))%4,true)}else if(e.key==='Home'){e.preventDefault();setPage(book,0,true)}else if(e.key==='End'){e.preventDefault();setPage(book,3,true)}else if(e.key==='Escape'){close(book,true)}});const panel=document.createElement('div');panel.className='page-content';panel.id='panel-'+app.id+'-'+i;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',tab.id);panel.innerHTML='<small>'+String(i+1).padStart(2,'0')+' / '+app.en+'</small><h2>'+data.title+'</h2><p>'+data.sub+'</p><div class="rule"></div>'+data.items.map(item=>'<div class="item"><strong>'+item[0]+'</strong><span>'+item[1]+'</span></div>').join('')+'<p class="page-foot">この頁はサンプルです</p>';page.append(tab,panel);tablist.append(page)});pages.append(tablist);cover.addEventListener('click',event=>{if(book.classList.contains('open')){close(book);return}const rect=cover.getBoundingClientRect();const picked=event.detail===0?Number(book.dataset.page):Math.max(0,Math.min(3,Math.floor((event.clientY-rect.top)/rect.height*4)));open(book,picked)});book.append(cover,pages);shelf.append(book);setPage(book,0);close(book)});live.textContent='アプリの表紙が4冊並んでいます';document.querySelector('#close-all').addEventListener('click',()=>{document.querySelectorAll('.book.open').forEach(b=>close(b));announce('すべての表紙を閉じました')});document.querySelector('#motion').addEventListener('click',e=>{reduced=!reduced;document.documentElement.classList.toggle('reduce',reduced);e.currentTarget.setAttribute('aria-pressed',String(reduced));announce(reduced?'動きを抑えます':'動きを元に戻しました')})})();
</script></body></html>
